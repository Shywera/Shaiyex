<style>

  *{box-sizing:border-box}
  html,body{height:100%}

  .hud{
    position:fixed;left:0;right:0;bottom:0;z-index:3;

  .bar-dip{background:rgba(7,10,18,.85)}
  .bar-fill{position:absolute;left:0;top:0;bottom:0;width:0;
            background:var(--cold);box-shadow:0 0 10px rgba(110,134,168,.7)}
  .bar-head{position:absolute;top:50%;width:2px;height:13px;margin-top:-6.5px;

<script>
(function(){
  "use strict";

  /* ------------------------------------------------------------------
     Measured off the file that ships. The impact and the leaving are both
     beats of the grid below: 18 and 64. That is how you know the grid is
     right and not merely close.
     ------------------------------------------------------------------ */
  var T = {
    her:     8.108,   /* beat 15. she comes in from off the edge */
    hit:     9.719,   /* beat 18. the biggest arrival in the track */
    gone:   76.804,   /* beat 143. the track thins out and so does she */
    reach:  78.414,   /* beat 146. he starts sending */
    stop:  111.704,   /* the last of it */
    quiet: 114.500,   /* and then twelve seconds of actual silence */
    dur:   126.247
  };

  /* She does not simply get closer for a minute. She pulls out and comes
     back, and the first one is the only one that is really in the track:
     between beats 64 and 70 the low end drops to nothing and then returns,
     which is the whole band stopping and starting again. The other two are
     smaller and sit in the sag the track has through the fifties and
     sixties. Out quickly, back slowly, every time. */
  var PULLS = [
    { a: 34.410, b: 37.630, out: 0.92 },   /* beats 64 to 70 */
    { a: 52.660, b: 56.417, out: 0.45 },   /* beats 98 to 105 */
    { a: 62.850, b: 66.608, out: 0.62 }    /* beats 117 to 124 */
  ];

  /* 111.781 bpm. the phase the three sections each land on agrees to
     within 28 ms across a hundred seconds, and grid lines carry fifteen
     times the average energy. */
  var GRID = { bpm: 111.781, t0: 0.057 };
  var SPB = 60 / GRID.bpm;

  var audio  = document.getElementById('track');
  var canvas = document.getElementById('viz');
  var gate   = document.getElementById('gate');
  var pp     = document.getElementById('pp');
  var bar    = document.getElementById('bar');
  var fill   = document.getElementById('fill');
  var head   = document.getElementById('head');
  var clock  = document.getElementById('clock');
  var ctx    = canvas.getContext('2d', { alpha: false });

  var reduce = window.matchMedia &&
               window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var TAU = Math.PI * 2;

  (function segments(){
    var at  = function(a){ return (a / T.dur * 100) + '%'; };
    var pct = function(a, b){ return ((b - a) / T.dur * 100) + '%'; };
    var h = document.getElementById('segHer'),
        a = document.getElementById('segAfter'),
        q = document.getElementById('segQuiet');
    h.style.left = at(T.her);    h.style.width = pct(T.her, T.gone);
    a.style.left = at(T.gone);   a.style.width = pct(T.gone, T.stop);
    q.style.left = at(T.stop);   q.style.width = pct(T.stop, T.dur);
    /* the dips she comes back from, marked so the bar has the shape too */
    var track = h.parentNode;
    for (var i = 0; i < PULLS.length; i++){
      var d = document.createElement('i');
      d.className = 'bar-act bar-dip';
      d.style.left = at(PULLS[i].a);
      d.style.width = pct(PULLS[i].a, PULLS[i].b);
      track.insertBefore(d, document.getElementById('fill'));
    }
  })();

  /* ================= audio ================= */
  var actx, analyser, freq;

  function listen(){
    if (actx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    analyser = actx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.82;   /* it is a slow song */
    freq = new Uint8Array(analyser.frequencyBinCount);
    actx.createMediaElementSource(audio).connect(analyser);
    analyser.connect(actx.destination);
    bands();
  }

  var N = 0, edges = [], level;

  function bands(){
    N = window.innerWidth < 620 ? 40 : 64;
    level = new Float32Array(N);
    edges = [];
    if (!analyser) return;
    var lo = 2, hi = Math.min(analyser.frequencyBinCount - 1, 300);
    for (var i = 0; i <= N; i++) edges.push(Math.round(lo * Math.pow(hi / lo, i / N)));
  }

  function readBands(){
    if (!analyser || !edges.length) return;
    analyser.getByteFrequencyData(freq);
    for (var i = 0; i < N; i++){
      var a = edges[i], b = Math.max(edges[i + 1], a + 1), m = 0;
      for (var j = a; j < b; j++) if (freq[j] > m) m = freq[j];
      var v = (m / 255) * (0.66 + 0.5 * (i / N));
      if (v > 1) v = 1;
      level[i] += (v - level[i]) * 0.20;
    }
  }

  function energy(a, b){
    if (!analyser) return 0;
    var s = 0;
    for (var i = a; i < b; i++) s += freq[i];
    return (s / (b - a)) / 255;
  }

  /* ================= the clock ================= */
  var lastBeat = -1e9, beatAt = -9, beatHard = 0;

  function beats(t){
    var n = Math.floor((t - GRID.t0) / SPB);
    if (n === lastBeat) return;
    var jump = n - lastBeat;
    lastBeat = n;
    if (jump < 0 || jump > 8) return;
    beatAt = GRID.t0 + n * SPB;
    /* no floor, so the silence at the end really is silent */
    beatHard = Math.min(1, energy(1, 20) * 1.8);

    if (t < T.reach || reduce) return;
    /* He keeps sending. Less often the further out it gets, and what he
       sends is weaker, and it gets less far. Nothing about that stops. */
    var every = fade < 0.25 ? 2 : fade < 0.5 ? 3 : fade < 0.72 ? 5 : 8;
    if (n % every === 0) sendReach();
  }

  /* ================= state ================= */
  function ease(x){ return x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x); }

  var bond = 0,   /* how much of her is on the screen */
      tight = 0,  /* how close in the spiral has got */
      pull = 0,   /* and how far back out she is at this exact moment */
      boom = 0,   /* the impact */
      flee = 0,   /* how long since she left, 0..1 over the flight out */
      fade = 0,   /* and then it is only ever less */
      lit  = 0;   /* what he has left */

  var FLIGHT = 2.8;   /* how long she takes to go. it is not quick. */

  function state(t){
    boom = t >= T.hit && t < T.hit + 1.4 ? Math.pow(1 - (t - T.hit) / 1.4, 2.2) : 0;

    pull = 0;
    for (var i = 0; i < PULLS.length; i++){
      var q = PULLS[i];
      if (t <= q.a || t >= q.b) continue;
      var k = (t - q.a) / (q.b - q.a);
      /* out fast, back slowly */
      pull = Math.max(pull, q.out *
        (k < 0.26 ? ease(k / 0.26) : Math.pow(1 - (k - 0.26) / 0.74, 1.5)));
    }

    if (t < T.her){ bond = 0; tight = 0; }
    else if (t < T.hit){ bond = Math.min(1, (t - T.her) / (T.hit - T.her) * 2.2); tight = 0; }
    else if (t < T.gone){
      bond = 1;
      tight = Math.pow((t - T.hit) / (T.gone - T.hit), 1.35);
    } else { bond = 0; tight = 1; }

    flee = t < T.gone ? 0 : Math.min(1, (t - T.gone) / FLIGHT);

    /* one direction only, all the way to the end */
    fade = t < T.gone ? 0 : ease((t - T.gone) / (T.stop - T.gone));

    /* Dim on his own, brighter the closer she gets, and then less and less
       for the remaining seventy seven seconds. What she was giving him goes
       in about half a second, which is a collapse rather than a cut, and
       after that the slope never turns back up. */
    /* how much of his light is hers. it dips every time she pulls out, and
       when she finally goes it drains over the whole time she is leaving,
       not in one frame. */
    var hers = t < T.gone
      ? bond * (0.20 + tight * 0.52) * (1 - pull * 0.80)
      : 0.72 * Math.pow(1 - Math.min(1, (t - T.gone) / (FLIGHT * 0.75)), 2);
    lit = 0.34
        + hers
        + boom * 0.30
        - fade * 0.30;
    /* Nothing in here has a far side. The pulls dip it while she is still
       around, because she comes back from those. Once she has gone, the
       only term left moving is fade, and fade only goes one way. */
    if (lit < 0.040) lit = 0.040;
    if (lit > 1.05) lit = 1.05;
  }

  /* ================= colour ================= */
  function mix(a, b, t){
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  }
  function rgba(c, a){
    return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')';
  }
  var INK   = [7, 10, 18];
  var COLD  = [110, 134, 168];
  var GREY  = [66, 76, 94];
  var HER   = [255, 137, 168];
  var HER_HOT = [255, 232, 238];
  var WARM  = [255, 201, 168];
  var CREAM = [255, 240, 224];

  function hisColour(){
    var c = mix(COLD, mix(HER, WARM, 0.72), bond * (0.35 + tight * 0.5));
    return mix(c, GREY, fade * 0.72);
  }

  /* ================= what he sends ================= */
  var reaches = [];

  function sendReach(){
    if (reaches.length > 12) return;
    reaches.push({
      p: 0,
      v: 0.5 + Math.random() * 0.3,
      power: 1 - fade * 0.7,
      /* it comes apart short of the other side, and shorter every time */
      far: (0.80 - fade * 0.46) * (0.75 + Math.random() * 0.35),
      wob: Math.random() * TAU
    });
  }

  /* ================= motes ================= */
  var motes = [];

  function mote(kind){
    var cap = (reduce ? 40 : 150) * (1 - slow * 0.6);
    if (motes.length > cap) return;
    var a = Math.random() * TAU;
    var r = Math.min(W, H) * (0.10 + Math.random() * 0.55);
    motes.push({
      x: W / 2 + Math.cos(a) * r * (W > H ? 1.5 : 1),
      y: H * 0.5 + Math.sin(a) * r,
      vx: (Math.random() - 0.5) * 4,
      vy: -1.5 - Math.random() * 5,
      life: 1, decay: 0.13 + Math.random() * 0.14,
      size: 0.5 + Math.random() * 1.5,
      her: !!kind
    });
  }

  /* ================= canvas ================= */
  var W = 0, H = 0, dpr = 1, ema = 0.016, slow = 0;

  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bands();
  }
  window.addEventListener('resize', size);

  function orb(x, y, r, c, hotc, a){
    if (a <= 0.004 || r <= 0.5) return;
    var g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0,    rgba(hotc, Math.min(1, a)));
    g.addColorStop(0.16, rgba(c, a * 0.72));
    g.addColorStop(0.45, rgba(c, a * 0.20));
    g.addColorStop(1,    rgba(c, 0));
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }

  /* she has an angle of her own and it speeds up as she comes in */
  var herA = -2.35, last = 0, now8 = 0, hisA = 0;
  var goneAt = { x: 0, y: 0, vx: 0, vy: 0, r: 0 };
  var caught = false;

  function frame(ms){
    requestAnimationFrame(frame);
    now8 = ms / 1000;
    var dt = last ? Math.min(now8 - last, 0.05) : 0.016;
    last = now8;
    ema = ema * 0.94 + dt * 0.06;
    slow = ema > 0.026 ? Math.min(1, slow + dt * 0.6) : Math.max(0, slow - dt * 0.25);

    var t = audio.currentTime;
    state(t);
    readBands();
    beats(t);

    var cx = W / 2, cy = H * 0.5;
    var M = Math.min(W, H);
    var RCAP = M * 0.40;      /* where his gravity takes hold of her */
    var RMIN = M * 0.055;     /* and how close it gets before she goes */

    var since = t - beatAt;
    var pulse = since >= 0 && since < 0.62
      ? Math.pow(1 - since / 0.62, 2.6) * beatHard * (1 - fade * 0.78) : 0;

    /* ---- the ground ---- */
    var field = mix(INK, [30, 15, 24], bond * (0.35 + tight * 0.75) * (1 - pull * 0.85));
    field = mix(field, [10, 11, 16], fade * 0.8);
    var ff = 0.20 + fade * 0.16 + pull * 0.06;
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.78);
    g.addColorStop(0, rgba(field, ff));
    g.addColorStop(0.42, rgba(mix(field, INK, 0.55), ff * 0.98));
    g.addColorStop(1, rgba(INK, Math.min(1, ff + 0.34 + fade * 0.2)));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    /* ---- where the two of them are ----
       She falls in, gets caught, and from then on the circle only ever gets
       smaller and quicker. He is pulled the other way by a fraction of it,
       because she is the one doing the moving. */
    var herR, hx, hy, qx, qy;

    if (t < T.hit){
      var k = t < T.her ? 0 : (t - T.her) / (T.hit - T.her);
      herR = M * 1.35 + (RCAP - M * 1.35) * (k * k);
      herA += dt * (0.30 + k * 1.1);
      caught = false;
    } else if (t < T.gone){
      /* the spiral, and then whatever she is doing this minute on top of it */
      var base = RCAP + (RMIN - RCAP) * tight;
      herR = base + (RCAP * 1.12 - base) * pull;
      /* closer is faster, which is what makes it a whirlwind and not a waltz,
         and it also means she slows right down every time she backs off */
      herA += dt * (0.55 + Math.pow(Math.max(0, 1 - herR / RCAP), 1.6) * 5.2);
      caught = true;
    } else {
      herR = RMIN;
    }

    var mu = 0.20;
    qx = cx + Math.cos(herA) * herR;
    qy = cy + Math.sin(herA) * herR * 0.86;
    hx = cx - Math.cos(herA) * herR * mu;
    hy = cy - Math.sin(herA) * herR * 0.86 * mu;

    if (t < T.gone){
      /* remember the state she left in, so the leaving is the same motion
         carried on rather than a cut to something else */
      goneAt.x = qx; goneAt.y = qy;
      goneAt.vx = -Math.sin(herA); goneAt.vy = Math.cos(herA) * 0.86;
      goneAt.hx = hx; goneAt.hy = hy;
    } else {
      /* he is left where he was and drifts back to the middle */
      var settle = ease((t - T.gone) / 4.5);
      hisA += dt * (0.32 - fade * 0.24);
      var own = M * (0.028 + fade * 0.020);
      hx = goneAt.hx + (cx + Math.cos(hisA) * own - goneAt.hx) * settle;
      hy = goneAt.hy + (cy + Math.sin(hisA) * own * 0.86 - goneAt.hy) * settle;
    }

    var hc = hisColour();
    ctx.globalCompositeOperation = 'lighter';

    /* ---- the ring she was on ----
       after she goes it is his, not hers, and the distance grows on its own */
    var Rghost = RMIN + fade * (M * 0.30 - RMIN);
    var ring = t < T.gone ? herR : Rghost;
    var ringA = t < T.gone
      ? (0.04 + bond * 0.09)
      /* as everything else dims, the shape is what is left to look at */
      : (0.05 + fade * 0.10);
    if (ringA > 0.008 && ring > 3){
      ctx.strokeStyle = rgba(mix(hc, HER, 0.35 * (1 - fade)), 1);
      ctx.globalAlpha = ringA;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(cx, cy, ring, ring * 0.86, 0, 0, TAU);
      ctx.stroke();
      /* and once it is dim enough to look at, there is a piece missing */
      if (t > T.gone + 14){
        var gap = ease((t - (T.gone + 14)) / 6) * 0.85;
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = gap * ringA * 9;
        ctx.strokeStyle = rgba(INK, 1);
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(cx, cy, ring, ring * 0.86, 0, -0.5, 0.5);
        ctx.stroke();
        ctx.globalCompositeOperation = 'lighter';
      }
    }
    ctx.globalAlpha = 1;

    /* ---- the tether ---- */
    if (bond > 0.02 && t < T.gone){
      /* the thread between them goes thin and faint every time she backs off */
      ctx.globalAlpha = bond * (0.18 + tight * 0.34 + pulse * 0.2) * (1 - pull * 0.8);
      var tg = ctx.createLinearGradient(hx, hy, qx, qy);
      tg.addColorStop(0, rgba(hc, 0.9));
      tg.addColorStop(0.5, rgba(HER_HOT, 0.55));
      tg.addColorStop(1, rgba(HER, 0.9));
      ctx.strokeStyle = tg;
      ctx.lineWidth = (1 + tight * 1.6) * (1 - pull * 0.55);
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(qx, qy); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    /* ---- the impact ---- */
    if (boom > 0.002){
      var br = M * (0.06 + (1 - boom) * 0.95);
      ctx.globalAlpha = boom * boom * 0.5;
      ctx.strokeStyle = rgba(mix(HER_HOT, WARM, 0.3), 1);
      ctx.lineWidth = 1 + boom * 5;
      ctx.beginPath(); ctx.ellipse(cx, cy, br, br * 0.86, 0, 0, TAU); ctx.stroke();
      ctx.globalAlpha = boom * 0.16;
      ctx.fillStyle = rgba(HER_HOT, 1);
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
      if (Math.random() < boom * 3) { mote(1); mote(1); }
    }

    /* ---- what he sends, and where it gets to ---- */
    for (var i = reaches.length - 1; i >= 0; i--){
      var rr = reaches[i];
      rr.p += dt * rr.v;
      if (rr.p >= 1){ reaches.splice(i, 1); continue; }
      var alive = rr.p < rr.far ? 1 : Math.pow(1 - (rr.p - rr.far) / (1 - rr.far), 1.4);
      if (alive <= 0.01) continue;
      var ang = hisA + rr.p * Math.PI;
      var wob = Math.sin(rr.p * 7 + rr.wob) * M * 0.012 * (1 - rr.p);
      var rx = cx + Math.cos(ang) * (ring + wob);
      var ry = cy + Math.sin(ang) * (ring + wob) * 0.86;
      ctx.globalAlpha = alive * (0.10 + rr.power * 0.26);
      ctx.fillStyle = rgba(mix(hc, HER, 0.4), 1);
      ctx.beginPath();
      ctx.arc(rx, ry, (0.9 + rr.power * 1.6) * alive, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    /* ---- her ---- */
    if (t < T.gone && bond > 0.01){
      var flick = 0.74 + Math.sin(now8 * 2.7) * 0.15 + Math.sin(now8 * 6.1) * 0.11;
      orb(qx, qy, M * (0.055 + bond * 0.05 + tight * 0.03) * (1 + pulse * 0.12),
          HER, HER_HOT,
          bond * flick * (0.42 + tight * 0.30 + pulse * 0.28) * (1 - pull * 0.45));
      if (Math.random() < (0.25 + tight * 0.8) * (1 - pull * 0.8)) mote(1);
    }

    /* ---- her leaving ----
       the same motion carried straight on, faster every frame, and then the
       screen does not have her on it any more */
    if (flee > 0 && flee < 1){
      /* She drifts at first, which is indistinguishable from the other times
         she pulled away, and by the time it is obviously not that she is
         already too far out to come back. */
      var gsec = t - T.gone;
      var d = M * (0.40 * gsec + 0.085 * Math.pow(gsec, 3.4));
      var fx = goneAt.x + goneAt.vx * d;
      var fy = goneAt.y + goneAt.vy * d;
      var tail = M * (0.06 + 0.5 * Math.min(1, gsec / 2));
      var px = goneAt.x + goneAt.vx * Math.max(0, d - tail);
      var py = goneAt.y + goneAt.vy * Math.max(0, d - tail);
      ctx.globalAlpha = Math.min(1, (1 - flee) * 1.3) * 0.7;
      var sg = ctx.createLinearGradient(px, py, fx, fy);
      sg.addColorStop(0, rgba(HER, 0));
      sg.addColorStop(1, rgba(HER_HOT, 0.9));
      ctx.strokeStyle = sg;
      ctx.lineWidth = 2.4;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(fx, fy); ctx.stroke();
      ctx.lineCap = 'butt';
      ctx.globalAlpha = 1;
      orb(fx, fy, M * 0.075, HER, HER_HOT, Math.min(1, (1 - flee) * 1.4) * 0.6);
    }

    /* ---- her place, once the track has stopped and nothing is happening ---- */
    var hold = ease((t - T.quiet) / 3.2);
    if (hold > 0.01){
      var wx = cx + Math.cos(hisA + Math.PI) * ring;
      var wy = cy + Math.sin(hisA + Math.PI) * ring * 0.86;
      orb(wx, wy, M * 0.075, HER, HER_HOT, hold * 0.20);
    }

    /* ---- him ---- */
    orb(hx, hy, M * (0.055 + lit * 0.075) * (1 + pulse * 0.10),
        hc, mix(hc, CREAM, 0.6), (0.10 + lit * 0.55) * (0.84 + pulse * 0.30));

    /* the sound of it, wrapped round him, and it goes quiet too */
    if (analyser && N){
      ctx.globalAlpha = (0.05 + lit * 0.18) * (1 - fade * 0.55);
      ctx.strokeStyle = rgba(mix(hc, CREAM, 0.3), 1);
      ctx.lineWidth = 1;
      ctx.beginPath();
      var Rb = M * (0.042 + lit * 0.030);
      for (var k2 = 0; k2 <= N; k2++){
        var v = level[k2 % N];
        var a2 = -hisA * 0.5 + (k2 / N) * TAU;
        var r2 = Rb + v * M * 0.028 * (0.4 + lit * 0.6) * (1 - fade * 0.6);
        var mx = hx + Math.cos(a2) * r2, my = hy + Math.sin(a2) * r2;
        if (k2 === 0) ctx.moveTo(mx, my); else ctx.lineTo(mx, my);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    /* ---- motes ---- */
    var want = (0.07 + bond * (0.5 + tight * 1.1) * (1 - pull * 0.8)) * (1 - fade * 0.9);
    if (Math.random() < want) mote(0);
    for (i = motes.length - 1; i >= 0; i--){
      var mo = motes[i];
      /* nothing of hers outlives her by more than a moment */
      if (mo.her && t >= T.gone){ mo.life -= dt * 3.5; }
      mo.x += mo.vx * dt; mo.y += mo.vy * dt;
      mo.life -= mo.decay * dt;
      if (mo.life <= 0){ motes.splice(i, 1); continue; }
      ctx.globalAlpha = mo.life * (0.14 + bond * 0.26 * (1 - pull * 0.7)) * (1 - fade * 0.85);
      ctx.fillStyle = rgba(mo.her ? HER : mix(hc, CREAM, 0.35), 1);
      ctx.beginPath(); ctx.arc(mo.x, mo.y, mo.size, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    hud(t);
  }

  /* ================= hud ================= */
  var lastShown = -1;
  function hud(t){
    var p = Math.max(0, Math.min(1, t / T.dur));
    fill.style.width = (p * 100) + '%';
    head.style.left = (p * 100) + '%';
    var s = t | 0;
    if (s !== lastShown){
      lastShown = s;
      clock.textContent = (s / 60 | 0) + ':' + ('0' + (s % 60)).slice(-2);
      bar.setAttribute('aria-valuenow', String(s));
    }
  }

  function jumped(){
    lastBeat = -1e9; beatAt = -9; beatHard = 0;
    reaches.length = 0; motes.length = 0;
    herA = -2.35; hisA = 0;
  }

  bar.addEventListener('click', function(e){
    var r = bar.getBoundingClientRect();
    audio.currentTime = Math.max(0, Math.min(T.dur - 0.05,
      ((e.clientX - r.left) / r.width) * T.dur));
    jumped();
  });
  bar.addEventListener('keydown', function(e){
    var d = e.key === 'ArrowRight' ? 5 : e.key === 'ArrowLeft' ? -5 : 0;
    if (!d) return;
    e.preventDefault();
    audio.currentTime = Math.max(0, Math.min(T.dur - 0.05, audio.currentTime + d));
    jumped();
  });

  function toggle(){
    if (audio.paused){
      if (actx && actx.state === 'suspended') actx.resume();
      audio.play();
    } else audio.pause();
  }
  pp.addEventListener('click', toggle);
  audio.addEventListener('play',  function(){ document.body.classList.add('going'); });
  audio.addEventListener('pause', function(){ document.body.classList.remove('going'); });
  document.addEventListener('keydown', function(e){
    if (e.code === 'Space' && e.target === document.body){ e.preventDefault(); toggle(); }
  });

  var idleTimer;
  function stir(){
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){ document.body.classList.add('idle'); }, 3000);
  }
  document.addEventListener('mousemove', stir);
  document.addEventListener('touchstart', stir);

  document.getElementById('start').addEventListener('click', function(){
    listen();
    if (actx && actx.state === 'suspended') actx.resume();
    audio.play();
    gate.classList.add('gone');
    setTimeout(function(){ gate.style.display = 'none'; }, 1300);
    stir();
  });

  window.__miss = {
    T: T, grid: GRID,
    at: function(t){
      state(t);
      return { bond: +bond.toFixed(3), tight: +tight.toFixed(3),
               pull: +pull.toFixed(3), boom: +boom.toFixed(3),
               flee: +flee.toFixed(3), fade: +fade.toFixed(3),
               lit: +lit.toFixed(3), reaches: reaches.length };
    }
  };

  size();
  requestAnimationFrame(frame);

  try { if (window.top !== window.self) document.querySelector('.backlink').remove(); }
  catch(e){}
})();
</script>
</body>
