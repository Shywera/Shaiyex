<style>
  :root{
    --ink:#05040A;
    --red:#C21A12;
    --red-hot:#FF4335;
    --gold:#F0C868;
    --gold-hot:#FFF3D2;
    --dim:#6E625C;

    --edge:#3A1210;
    --key:var(--red);
    --key-hot:var(--red-hot);

    --mono:"JetBrains Mono",Consolas,ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;overflow:hidden;background:#000;
    color:var(--dim);font-family:var(--mono);
    -webkit-font-smoothing:antialiased;
  }
  /* the html furniture follows the canvas, slowly */
  body.act2, body.outro{
    --edge:#4A3A12;
    --key:var(--gold);
    --key-hot:var(--gold-hot);
  }

  #viz{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

  /* ---------- bottom bar ---------- */
  .hud{
    position:fixed;left:0;right:0;bottom:0;z-index:3;
    display:flex;align-items:center;gap:12px;
    padding:12px clamp(12px,3vw,22px) 14px;
    font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    background:linear-gradient(180deg, rgba(2,2,4,0), rgba(2,2,4,.9) 46%);
    transition:opacity .5s ease;
  }
  body.idle .hud{opacity:.12}
  .hud:hover{opacity:1 !important}
  .pp{
    flex:0 0 auto;width:30px;height:30px;padding:0;cursor:pointer;
    background:transparent;border:1px solid var(--edge);border-radius:2px;
    color:var(--key);
    display:flex;align-items:center;justify-content:center;
    transition:border-color .6s ease, color 1.8s ease, background .25s ease;
  }
  .pp:hover{background:rgba(255,255,255,.06);border-color:var(--key)}
  .pp b{display:block;width:0;height:0;
        border-left:9px solid currentColor;border-top:6px solid transparent;
        border-bottom:6px solid transparent;margin-left:2px}
  body.going .pp b{
    width:9px;height:11px;border:0;margin:0;background:currentColor;
    box-shadow:inset 3px 0 0 rgba(0,0,0,.85);
  }

  .bar{position:relative;flex:1 1 auto;height:20px;cursor:pointer;
       display:flex;align-items:center}
  .bar-track{position:relative;width:100%;height:3px;
             background:rgba(255,255,255,.08);overflow:hidden}
  .bar-act{position:absolute;top:0;bottom:0}
  .bar-a1{background:rgba(194,26,18,.4)}
  .bar-a2{background:rgba(240,200,104,.3)}
  .bar-gap{background:rgba(255,255,255,.04)}
  .bar-fill{position:absolute;left:0;top:0;bottom:0;width:0;
            background:var(--key-hot);box-shadow:0 0 12px var(--key-hot)}
  .bar-head{position:absolute;top:50%;width:2px;height:13px;margin-top:-6.5px;
            background:#FFF;opacity:.8;pointer-events:none}
  .t{flex:0 0 auto;font-variant-numeric:tabular-nums;letter-spacing:.1em}

  .backlink{
    position:fixed;top:14px;left:14px;z-index:4;
    font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim);text-decoration:none;
    padding:7px 11px 8px;border:1px solid var(--edge);border-radius:2px;
    background:rgba(5,4,10,.7);
    transition:color .25s ease, border-color .6s ease, opacity .5s ease;
  }
  .backlink:hover{color:#FFF;border-color:var(--key)}
  body.idle .backlink{opacity:.12}
  .backlink:hover{opacity:1}

  .credit{
    position:fixed;top:16px;right:16px;z-index:4;text-align:right;
    font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
    color:var(--dim);line-height:1.9;pointer-events:none;
    transition:opacity .5s ease;
  }
  .credit b{color:var(--key);font-weight:700;transition:color 1.8s ease}
  body.idle .credit{opacity:.14}

  /* ---------- the seal ---------- */
  /* The turn washes the screen white, and then Steam turns up to award
     you for it. Bottom right, which is where the real one goes, and it
     waits out the white before sliding in so it is not announcing itself
     into a frame you cannot see. */
  .ach{
    position:fixed;right:16px;bottom:58px;z-index:6;
    display:flex;align-items:center;gap:12px;
    padding:9px 18px 9px 9px;
    max-width:calc(100vw - 32px);
    font-family:"Motiva Sans",Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#33536f 0%,#1b2838 58%,#12171d 100%);
    border:1px solid rgba(150,195,240,.20);
    border-radius:3px;
    box-shadow:0 10px 30px rgba(0,0,0,.78), inset 0 1px 0 rgba(255,255,255,.10);
    opacity:0;transform:translateY(22px);
    transition:opacity .36s ease, transform .42s cubic-bezier(.18,.9,.28,1);
    pointer-events:none;
  }
  .ach.up{opacity:1;transform:none}
  .ach-ico{
    flex:0 0 auto;width:52px;height:52px;border-radius:2px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#ffd97a,#e2a423 58%,#a2660e);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.28);
  }
  .ach-ico svg{display:block;width:38px;height:38px}
  .ach-txt{min-width:0}
  .ach-txt b{
    display:block;font-size:12px;font-weight:400;letter-spacing:.01em;
    color:#c7d5e0;
  }
  .ach-txt span{
    display:block;margin-top:2px;font-size:15px;font-weight:700;
    color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  @media (max-width:560px){
    .ach{right:10px;bottom:54px;padding:8px 14px 8px 8px}
    .ach-ico{width:44px;height:44px}
    .ach-ico svg{width:32px;height:32px}
    .ach-txt span{font-size:13px}
  }
  @media (prefers-reduced-motion: reduce){
    .ach{transform:none;transition:opacity .36s ease}
  }

  .gate{
    position:fixed;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:26px;padding:24px;text-align:center;
    background:radial-gradient(66% 52% at 50% 44%, #16070A, #05040A 76%);
    transition:opacity .9s ease;
  }
  .gate.gone{opacity:0;pointer-events:none}
  .gate .x{
    position:relative;width:3px;height:82px;background:var(--red);
    box-shadow:0 0 26px rgba(194,26,18,.9);transform:rotate(180deg);
  }
  .gate .x::before{
    content:"";position:absolute;left:50%;top:22px;margin-left:-18px;
    width:37px;height:3px;background:inherit;box-shadow:inherit;
  }
  .gate h1{
    margin:0;font-family:"Grenze Gotisch",serif;font-weight:800;
    font-size:clamp(50px,14vw,150px);line-height:.88;letter-spacing:.03em;
    color:#F4E8DC;text-shadow:0 0 46px rgba(194,26,18,.6), 0 3px 0 #05040A;
  }
  .gate p{
    margin:0;font-size:10px;font-weight:700;letter-spacing:.26em;
    text-transform:uppercase;color:#6A5A55;
  }
  .gate button{
    margin-top:4px;cursor:pointer;font-family:var(--mono);
    font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
    color:#05040A;background:var(--red-hot);border:1px solid #FF7A6E;
    border-radius:2px;padding:14px 32px 15px;
    transition:background .2s ease, transform .1s ease;
  }
  .gate button:hover{background:#FF5C4E}
  .gate button:active{transform:translateY(2px)}
  .gate button:focus-visible{outline:2px solid var(--gold);outline-offset:4px}

  @media (max-width:560px){ .credit{display:none} }
</style>
</head>

<div class="hud" id="hud">
  <button class="pp" id="pp" type="button" aria-label="Play or pause"><b></b></button>
  <div class="bar" id="bar" role="slider" tabindex="0"
       aria-label="Position" aria-valuemin="0" aria-valuemax="202" aria-valuenow="0">
    <div class="bar-track">
      <i class="bar-act bar-a1" id="segA"></i>

            fill="none" stroke="#2b1c07" stroke-width="3.4" stroke-linejoin="round"/>
      <circle cx="24" cy="24" r="6.6" fill="#2b1c07"/>
      <circle cx="26.5" cy="21.5" r="2.2" fill="#ffeab4"/>
    </svg>
  </span>
  <div class="ach-txt">

</div>

<div class="gate" id="gate">
  <i class="x" aria-hidden="true"></i>
  <h1>Anathema</h1>
  <p>Headphones &middot; it does not stay like this</p>
  <button id="start" type="button">Break the seal</button>
</div>

<audio id="track" src="track.mp3" preload="auto"></audio>
<audio id="achSfx" src="ach.mp3" preload="auto"></audio>

<script>
(function(){
  "use strict";

  /* Measured off the file that ships. Re-encode the track and these move.
     Every one of these is a beat of the grid below. */
  var T = {
    lift:    12.013,  /* the first section arrives */
    beat:    44.413,  /* the beat proper walks in. rms doubles on this line */
    ease:    53.413,  /* and steps back out */
    drop:    63.013,  /* the hardcore lands, centroid falls off a cliff */
    cut:     85.689,  /* everything stops. four seconds of actual nothing */
    back:    89.90,   /* it creeps back */
    bright: 113.413,  /* the turn. the whole reason for the page */
    hyper:  137.413,  /* and then it stops being polite about it */
    outro:  186.33,
    dur:    202.57
  };

  /* How much of everything, section by section. 0 is nothing, 4 is hyper.
     This is the shape of the track, not a guess: each mark is where the low
     band actually steps up or down. */
  var ARC = [
    [0,        0],
    [T.lift,   1],
    [T.beat,   3],
    [T.ease,   1],
    [T.drop,   4],
    [T.cut,    0],
    [T.bright, 2],
    [T.hyper,  4],
    [T.outro,  1]
  ];

  var audio  = document.getElementById('track');
  var canvas = document.getElementById('viz');
  var gate   = document.getElementById('gate');
  var pp     = document.getElementById('pp');
  var bar    = document.getElementById('bar');
  var fill   = document.getElementById('fill');
  var head   = document.getElementById('head');
  var clock  = document.getElementById('clock');
  var ctx    = canvas.getContext('2d', { alpha: false });

  var reduce = window.matchMedia &&
               window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var TAU = Math.PI * 2;

  (function segments(){
    var at  = function(a){ return (a / T.dur * 100) + '%'; };
    var pct = function(a, b){ return ((b - a) / T.dur * 100) + '%'; };
    var a = document.getElementById('segA'),
        g = document.getElementById('segG'),
        b = document.getElementById('segB');
    a.style.left = '0';          a.style.width = pct(0, T.cut);
    g.style.left = at(T.cut);    g.style.width = pct(T.cut, T.bright);
    b.style.left = at(T.bright); b.style.width = pct(T.bright, T.dur);
  })();

  /* ================= audio ================= */
  var actx, analyser, freq, wave;

  function listen(){
    if (actx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    analyser = actx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.7;
    freq = new Uint8Array(analyser.frequencyBinCount);
    wave = new Uint8Array(analyser.fftSize);
    actx.createMediaElementSource(audio).connect(analyser);
    analyser.connect(actx.destination);
    bands();
  }

  var N = 0, edges = [], level, peak, soft;

  function bands(){
    N = window.innerWidth < 620 ? 56 : 88;
    level = new Float32Array(N);
    peak  = new Float32Array(N);
    soft  = new Float32Array(N);
    edges = [];
    if (!analyser) return;
    var lo = 2, hi = Math.min(analyser.frequencyBinCount - 1, 512);
    for (var i = 0; i <= N; i++) edges.push(Math.round(lo * Math.pow(hi / lo, i / N)));
  }

  function readBands(){
    if (!analyser || !edges.length) return;
    analyser.getByteFrequencyData(freq);
    var i;
    for (i = 0; i < N; i++){
      var a = edges[i], b = Math.max(edges[i + 1], a + 1), m = 0;
      for (var j = a; j < b; j++) if (freq[j] > m) m = freq[j];
      var v = (m / 255) * (0.60 + 0.58 * (i / N));
      v = Math.pow(v > 1 ? 1 : v, 1.34);
      level[i] += (v - level[i]) * 0.44;
      peak[i] = Math.max(peak[i] * 0.93, level[i]);
    }
    for (i = 0; i < N; i++){
      soft[i] = (level[(i + N - 1) % N] + 2 * level[i] + level[(i + 1) % N]) * 0.25;
    }
  }

  function energy(a, b){
    if (!analyser) return 0;
    var s = 0;
    for (var i = a; i < b; i++) s += freq[i];
    return (s / (b - a)) / 255;
  }

  /* ---- the clock ----------------------------------------------------------
     Everything used to fire off transient detection, which means it fired off
     whatever happened to be loudest: a hat, a vocal chop, a crash. On the beat
     is not the same thing as on the loudest thing.

     So: 200.000 bpm, first beat at 0.013 s. Measured off the shipped file by
     fitting a comb over the onset envelope. The tempo is exactly 200 and not
     merely near it, which you can tell because the phase the four sections
     each land on agrees to within 15 ms across 174 seconds. A tempo that was
     even a tenth out would have drifted a whole beat by the end. Grid lines
     carry 7.3 times the average energy.

     Both section marks above sit on a downbeat of this grid, which is why
     BAR is 2: beat 210 is the drop, beat 378 is the turn.
     -------------------------------------------------------------------- */
  var GRID = { bpm: 200, t0: 0.013 };
  var SPB = 60 / GRID.bpm;
  var BAR = 2;

  var lastBeat = -1e9, kickAt = -9, kickHard = 0, tearAt = -9;

  /* The phrase, for the accents rather than the pulse. 32 beats is what this
     track actually repeats on, measured over the hyper section, and 16 is the
     half of it that still reads as structure without being rare. Counting
     from the beat the section starts on means the first accent lands exactly
     on the section start rather than wherever the bar count happened to be. */
  var PHRASE = 16;
  var HY = Math.round((T.hyper - GRID.t0) / SPB);

  function beats(t){
    var n = Math.floor((t - GRID.t0) / SPB);
    if (n === lastBeat) return;
    var jump = n - lastBeat;
    lastBeat = n;
    if (jump < 0 || jump > 8) return;      /* a seek, not a bar of music */

    var down = (n % 4 + 4) % 4 === BAR;    /* first beat of the bar */
    var half = (n % 2 + 2) % 2 === BAR % 2;

    /* the grid says when, the track still says how hard */
    kickAt = GRID.t0 + n * SPB;
    kickHard = Math.min(1, (0.24 + energy(1, 8) * 1.5) * (half ? 1 : 0.66 + lvl * 0.07))
             * (0.22 + Math.min(1, lvl / 2) * 0.78);   /* a quiet stretch still breathes */

    if (hush < 0.25 || lvl < 0.5) return;

    /* how often a ring goes out, and how big it is when it does. once the
       beat has properly arrived every single one of them is a big one. */
    var fire = lvl >= 2.5 ? true : lvl >= 1.5 ? half : down;
    if (fire){
      waves.push({ r: 0, life: 1, hard: kickHard, bar: lvl >= 2.5 || down });
      if (waves.length > 20) waves.shift();
    }
    if (warm > 0.35 && !reduce) hit();

    if (down && lvl >= 2.5 && warm < 0.5 && !reduce) tearAt = kickAt;

    if (lvl >= 3.4 && !reduce){
      /* swords belong to the half with a paladin in it */
      if (warm > 0.5){
        slash();
        /* and at the top of a phrase, two of them, crossing near the middle */
        if (((n - HY) % PHRASE + PHRASE) % PHRASE === 0){
          var a0 = Math.random() * TAU;
          slash(a0, true);
          slash(a0 + Math.PI / 2 + (Math.random() - 0.5) * 0.5, true);
        }
      }
      if (down) flashes.push({ t: kickAt, dur: 0.26, power: 0.30,
                               c: warm > 0.5 ? GOLD_HOT : RED_HOT });
    }
  }

  /* ================= state ================= */
  var warm = 0,    /* 0 the curse, 1 the light */
      hush = 1,    /* the cut */
      heat = 0,    /* how much violence the first half is doing */
      lvl = 0,     /* where the arc is, smoothed */
      lvlT = 0,    /* and where it is heading */
      phase = '',
      idle = false;

  var flashes = [];   /* {t, dur, power, c} in audio seconds */
  var burst = 0;      /* the god rays punching out at the turn */
  var swell = -9;     /* the turn itself, which is a ball before it is a wall */
  var fired = {};

  function ease(x){ return x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x); }

  function once(key, t, when, run){
    /* fire when the clock crosses a mark, and never twice */
    if (t >= when && t < when + 1.2 && !fired[key]){ fired[key] = true; run(); }
    if (t < when - 0.5 || t > when + 4) fired[key] = false;
  }

  function state(t, dt){
    warm = ease((t - T.bright) / 4.6);

    lvlT = 0;
    for (var q = 0; q < ARC.length; q++) if (t >= ARC[q][0]) lvlT = ARC[q][1];
    /* no dt means somebody is probing a moment rather than playing it */
    lvl += (lvlT - lvl) * (dt ? Math.min(1, dt * 7) : 1);

    hush = 1;
    if (t > T.cut - 0.1 && t < T.back + 1.0){
      hush = 1 - ease((t - (T.cut - 0.1)) / 0.42);
      if (t > T.back) hush = ease((t - T.back) / 1.0);
    }

    /* the first half only, and only once the arc is past medium */
    heat = (1 - Math.min(1, warm * 2)) * Math.max(0, Math.min(1, (lvl - 2) / 2));

    once('drop', t, T.drop, function(){
      flashes.push({ t: t, dur: 1.1, power: 1.5, c: [255, 60, 40] });
    });
    once('cut', t, T.cut, function(){
      flashes.length = 0; waves.length = 0; circles.length = 0; dust.length = 0;
      slashes.length = 0;
      blackout = 1;
    });
    once('turn', t, T.bright, function(){
      swell = t;
      burst = 1;
      waves.push({ r: 0, life: 1, hard: 1, holy: 1 });
      achieve();
    });

    burst *= 0.982;

    var p = t >= T.outro ? 'outro'
          : t >= T.bright ? 'act2'
          : (t >= T.cut && t < T.back) ? 'cut' : 'act1';
    if (p !== phase){
      document.body.classList.remove('act1', 'cut', 'act2', 'outro');
      document.body.classList.add(p);
      phase = p;
    }
  }

  /* ================= colour ================= */
  function mix(a, b, t){
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  }
  function rgba(c, a){
    return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')';
  }
  var RED = [194, 26, 18], RED_HOT = [255, 108, 76], EMBER = [255, 168, 96];
  var GOLD = [240, 200, 104], GOLD_HOT = [255, 248, 226], WHITE = [255, 255, 255];
  var INK = [5, 4, 10], INK_WARM = [10, 8, 5];

  /* ================= transient things ================= */
  var waves = [], circles = [], dust = [], shards = [], slashes = [];
  var blackout = 0;

  function hit(){
    if (circles.length > 8) return;
    var ang = Math.random() * TAU;
    var rad = Math.min(W, H) * (0.36 + Math.random() * 0.17);
    circles.push({
      x: Math.max(52, Math.min(W - 52, W / 2 + Math.cos(ang) * rad * (W > H ? 1.55 : 1))),
      y: Math.max(52, Math.min(H - 110, H * 0.46 + Math.sin(ang) * rad)),
      t: 0, dur: 0.6, pop: 0
    });
  }

  /* A slash. It is a cut drawn across the whole screen with a blade riding
     the leading edge, and it is built out of three strokes of a gradient,
     which is the same trick the beams on /why/ use and costs about the same
     as nothing. Hyper only, and only in the half that has any business
     swinging a sword. */
  function slash(a, tight){
    if (slashes.length > 6) return;
    if (a === undefined) a = Math.random() * TAU;
    var off = (Math.random() - 0.5) * Math.min(W, H) * (tight ? 0.22 : 0.8);
    slashes.push({
      a: a,
      px: W / 2 - Math.sin(a) * off,
      py: H * 0.46 + Math.cos(a) * off,
      L: Math.sqrt(W * W + H * H) * 0.62,
      t: 0, swing: 0.10, dur: 0.66
    });
  }

  function drawSlash(s){
    var p = Math.min(1, s.t / s.swing);
    var k = s.t / s.dur;
    var fade = k < 0.16 ? 1 : Math.pow(1 - (k - 0.16) / 0.84, 1.7);
    if (fade <= 0.01) return;

    var ca = Math.cos(s.a), sa = Math.sin(s.a);
    var x0 = s.px - ca * s.L, y0 = s.py - sa * s.L;
    var head = -s.L + p * 2 * s.L;
    var x1 = s.px + ca * head, y1 = s.py + sa * head;

    ctx.globalCompositeOperation = 'lighter';
    var g = ctx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0,    rgba(GOLD, 0));
    g.addColorStop(0.4,  rgba(GOLD_HOT, 0.45));
    g.addColorStop(1,    rgba(WHITE, 0.95));
    ctx.strokeStyle = g;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);

    ctx.globalAlpha = 0.12 * fade;  ctx.lineWidth = 22; ctx.stroke();
    ctx.globalAlpha = 0.26 * fade;  ctx.lineWidth = 7;  ctx.stroke();
    ctx.globalAlpha = 0.95 * fade;  ctx.lineWidth = 2;  ctx.stroke();

    /* the blade making the cut, only while it is still travelling */
    if (p < 1){
      var L = Math.min(W, H) * 0.13, w = L * 0.05;
      ctx.save();
      ctx.translate(x1, y1);
      ctx.rotate(s.a - Math.PI / 2);
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = rgba(GOLD_HOT, 1);
      ctx.beginPath();
      ctx.moveTo(-w, -L * 0.60);
      ctx.lineTo(w, -L * 0.60);
      ctx.lineTo(w * 0.6, L * 0.28);
      ctx.lineTo(0, L * 0.50);
      ctx.lineTo(-w * 0.6, L * 0.28);
      ctx.closePath();
      ctx.fill();
      ctx.fillRect(-L * 0.15, -L * 0.66, L * 0.30, w);
      ctx.fillRect(-w * 0.55, -L * 0.84, w * 1.1, L * 0.20);
      ctx.restore();
    }

    ctx.globalAlpha = 1;
    ctx.lineCap = 'butt';
    ctx.globalCompositeOperation = 'source-over';
  }

  function shard(cx, cy, R){
    if (shards.length > 90) return;
    var a = Math.random() * TAU, sp = 180 + Math.random() * 620;
    shards.push({
      x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
      a: Math.random() * TAU, va: (Math.random() - 0.5) * 9,
      len: 5 + Math.random() * 20, life: 1, decay: 0.5 + Math.random() * 0.6
    });
  }

  function speck(){
    if (dust.length > (reduce ? 50 : 210) * (1 - slow * 0.65)) return;
    if (warm > 0.5){
      dust.push({ x: Math.random() * W, y: H + 12,
                  vx: (Math.random() - 0.5) * 12, vy: -16 - Math.random() * 34,
                  life: 1, decay: 0.13 + Math.random() * 0.12,
                  size: 0.5 + Math.random() * 1.3, warm: 1 });
    } else {
      dust.push({ x: W / 2 + (Math.random() - 0.5) * W, y: H * 0.94,
                  vx: (Math.random() - 0.5) * 30, vy: -40 - Math.random() * 90,
                  life: 1, decay: 0.3 + Math.random() * 0.28,
                  size: 0.8 + Math.random() * 1.8, warm: 0 });
    }
  }

  /* ================= canvas ================= */
  var W = 0, H = 0, dpr = 1;

  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bands();
  }
  window.addEventListener('resize', size);

  /* ---- the cross. one shape, and it physically turns over at the change.
     Drawn out of gradients rather than blocks, because a solid bar reads as a
     bar and the whole point is that it is made of light. ---- */
  function cross(cx, cy, S, bump){
    /* the palette turns first and the cross holds out, then it goes over
       all at once, which is the whole moment */
    var rot = (1 - Math.pow(warm, 2.6)) * Math.PI;
    var barW = S * 0.026;
    var top  = -S * 0.52, bot = S * 0.48;
    var armY = top + S * 0.30, armW = S * 0.185;

    /* how bright, and in what */
    /* This is a still shape drawn additively on top of motion trails, so
       whatever alpha it gets is not what you see: the frame only fades by
       about a third each time, and the rest piles up. Draw it at the
       brightness you want and it settles at three times that, clips to flat
       white, and the soft edge turns into a cut. So these are the target
       divided by the fade. */
    var a, core, edge, blur;
    if (warm < 0.5){
      var flick = 0.80 + Math.sin(now8 * 41) * 0.10 + Math.sin(now8 * 13.7) * 0.10;
      a = (1 - warm) * hush * (0.085 + heat * 0.265 + bump * 0.135) * flick;
      core = mix(RED_HOT, [255, 210, 180], heat * 0.5 + bump * 0.3);
      edge = RED;
      blur = 0.9 + heat * 1.5 + bump * 1.3;
    } else {
      a = warm * (0.185 + bump * 0.085 + burst * 0.18);
      core = WHITE;
      edge = GOLD;
      blur = 1.5 + bump * 2.0 + burst * 3.2;
    }
    if (a <= 0.002) return;
    if (a > 1) a = 1;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.globalCompositeOperation = 'lighter';

    /* The bloom. This used to be a shadowBlur on two large fills, which on its
       own cost more than everything else on the page put together: 11.7 fps
       became 58.7 the moment it was switched off. One radial gradient does
       the same job for nothing. */
    var gr = S * 0.34 * (0.7 + blur * 0.16);
    var bg = ctx.createRadialGradient(0, 0, 0, 0, 0, gr);
    bg.addColorStop(0,    rgba(core, a * 0.30 * Math.min(1.4, blur)));
    bg.addColorStop(0.35, rgba(edge, a * 0.16 * Math.min(1.4, blur)));
    bg.addColorStop(1,    rgba(edge, 0));
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(0, 0, gr, 0, TAU); ctx.fill();

    /* The shaft. The gradient softens the two long sides, and the shape comes
       to a point at each end, because a bar drawn as a rectangle ends in a
       flat cut and reads as a plank rather than a shaft of light. */
    var w = barW * 2.6;
    var tp = (bot - top) * 0.17;
    var sg = ctx.createLinearGradient(-w, 0, w, 0);
    sg.addColorStop(0,    rgba(edge, 0));
    sg.addColorStop(0.32, rgba(edge, a * 0.55));
    sg.addColorStop(0.5,  rgba(core, a));
    sg.addColorStop(0.68, rgba(edge, a * 0.55));
    sg.addColorStop(1,    rgba(edge, 0));
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.moveTo(-w, top + tp);
    ctx.lineTo(0, top);
    ctx.lineTo(w, top + tp);
    ctx.lineTo(w, bot - tp);
    ctx.lineTo(0, bot);
    ctx.lineTo(-w, bot - tp);
    ctx.closePath();
    ctx.fill();

    /* the arm, the same trick turned ninety degrees */
    var ah = barW * 2.6;
    var ta = armW * 0.36;
    var ag = ctx.createLinearGradient(0, armY - ah, 0, armY + ah);
    ag.addColorStop(0,    rgba(edge, 0));
    ag.addColorStop(0.32, rgba(edge, a * 0.55));
    ag.addColorStop(0.5,  rgba(core, a));
    ag.addColorStop(0.68, rgba(edge, a * 0.55));
    ag.addColorStop(1,    rgba(edge, 0));
    ctx.fillStyle = ag;
    ctx.beginPath();
    ctx.moveTo(-armW, armY);
    ctx.lineTo(-armW + ta, armY - ah);
    ctx.lineTo(armW - ta, armY - ah);
    ctx.lineTo(armW, armY);
    ctx.lineTo(armW - ta, armY + ah);
    ctx.lineTo(-armW + ta, armY + ah);
    ctx.closePath();
    ctx.fill();

    /* and once it is the holy one, the flare across the join */
    if (warm > 0.5){
      var f = Math.min(0.30, 0.095 * warm + bump * 0.12 + burst * 0.20);
      ctx.save();
      ctx.translate(0, armY);
      /* squashing the circle squashes its falloff too, so keep it gentle or
         the top and bottom of the flare become a line */
      ctx.scale(1, 0.24);
      var r = armW * 3.8;
      var fg = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
      fg.addColorStop(0,    rgba(WHITE, f));
      fg.addColorStop(0.22, rgba(GOLD_HOT, f * 0.55));
      fg.addColorStop(0.55, rgba(GOLD, f * 0.16));
      fg.addColorStop(1,    rgba(GOLD, 0));
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      ctx.restore();
    }

    ctx.restore();
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---- act one: teeth ---- */
  function shardRing(cx, cy, R, span, bump){
    ctx.globalAlpha = (1 - warm) * hush;
    var key = RED, hot = mix(RED_HOT, [255, 230, 210], heat * 0.5);
    for (var i = 0; i < N; i++){
      var v = level[i];
      var a = spin + (i / N) * TAU;
      var jit = heat * kickHard * bump * 0.5;
      var r2 = R + v * span * (1 + bump * 0.7 + jit);
      var wdt = (TAU / N) * 0.34 * (0.5 + v * 0.8);
      var ca = Math.cos(a), sa = Math.sin(a);

      ctx.fillStyle = rgba(mix(key, hot, v * v), 0.30 + v * 0.7);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a - wdt) * R, cy + Math.sin(a - wdt) * R);
      ctx.lineTo(cx + ca * r2, cy + sa * r2);
      ctx.lineTo(cx + Math.cos(a + wdt) * R, cy + Math.sin(a + wdt) * R);
      ctx.closePath();
      ctx.fill();

      /* teeth pointing back in */
      if (heat > 0.02){
        var r3 = R - v * span * 0.34 * heat;
        ctx.globalAlpha = (1 - warm) * hush * heat * 0.55;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a - wdt * 0.6) * R, cy + Math.sin(a - wdt * 0.6) * R);
        ctx.lineTo(cx + ca * r3, cy + sa * r3);
        ctx.lineTo(cx + Math.cos(a + wdt * 0.6) * R, cy + Math.sin(a + wdt * 0.6) * R);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = (1 - warm) * hush;
      }
    }
    ctx.globalAlpha = 1;
  }

  /* ---- act two: everything is made of light ---- */
  var RAYS = 30;

  function godRays(cx, cy, R, bump){
    ctx.globalCompositeOperation = 'lighter';
    var reach = Math.max(W, H) * (0.62 + burst * 0.7);
    var rays = RAYS - ((slow * 14) | 0);
    for (var i = 0; i < rays; i++){
      var v = soft[(i * 3) % N];
      var a = rayspin + (i / rays) * TAU;
      var len = R * 0.9 + (v * 0.75 + bump * 0.3 + burst * 0.9) * reach;
      var w = (TAU / rays) * (0.20 + v * 0.30);
      ctx.fillStyle = rgba(mix(GOLD, GOLD_HOT, v * 0.6 + burst * 0.4),
                           0.026 + v * 0.055 + burst * 0.05);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a - w) * R * 0.62, cy + Math.sin(a - w) * R * 0.62);
      ctx.lineTo(cx + Math.cos(a) * len, cy + Math.sin(a) * len);
      ctx.lineTo(cx + Math.cos(a + w) * R * 0.62, cy + Math.sin(a + w) * R * 0.62);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function halo(cx, cy, R, bump){
    ctx.globalCompositeOperation = 'lighter';
    var reach = R * (2.1 + burst * 1.6);
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, reach);
    var p = 0.16 + bump * 0.16 + burst * 0.5;
    g.addColorStop(0,    rgba(GOLD_HOT, p * warm));
    g.addColorStop(0.24, rgba(GOLD, p * 0.5 * warm));
    g.addColorStop(1,    rgba(GOLD, 0));
    ctx.fillStyle = g;
    /* it is zero past `reach`, so there is no reason to fill the whole page */
    ctx.fillRect(cx - reach, cy - reach, reach * 2, reach * 2);
    ctx.globalCompositeOperation = 'source-over';
  }

  /* a rose window, which is the most holy shape there is */
  function rose(cx, cy, R, bump){
    var lo = 0, mid = 0, i;
    for (i = 0; i < N; i++){ if (i < N * 0.3) lo += soft[i]; else mid += soft[i]; }
    lo /= N * 0.3; mid /= N * 0.7;

    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = warm;

    var PET = 12, Rr = R * (1.38 + lo * 0.16 + bump * 0.05) * (1 + burst * 1.9);
    ctx.strokeStyle = rgba(GOLD, 0.30 + mid * 0.4);
    ctx.lineWidth = 1.1;
    for (i = 0; i < PET; i++){
      var a = -rayspin * 0.55 + (i / PET) * TAU;
      var px = cx + Math.cos(a) * Rr, py = cy + Math.sin(a) * Rr;
      ctx.beginPath();
      ctx.arc(px, py, R * (0.30 + mid * 0.10), 0, TAU);
      ctx.stroke();
    }

    /* the tracery */
    ctx.strokeStyle = rgba(GOLD_HOT, 0.16 + lo * 0.34);
    ctx.lineWidth = 1;
    for (i = 0; i < PET * 2; i++){
      var b = -rayspin * 0.55 + (i / (PET * 2)) * TAU;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(b) * R * 1.06, cy + Math.sin(b) * R * 1.06);
      ctx.lineTo(cx + Math.cos(b) * (Rr + R * 0.32), cy + Math.sin(b) * (Rr + R * 0.32));
      ctx.stroke();
    }

    var rings = [1.06, 1.72, 2.05];
    for (i = 0; i < rings.length; i++){
      ctx.globalAlpha = warm * (0.36 - i * 0.09 + mid * 0.3);
      ctx.beginPath();
      ctx.arc(cx, cy, R * rings[i] * (1 + bump * 0.02), 0, TAU);
      ctx.stroke();
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function lightRing(cx, cy, R, span, bump){
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = warm * hush;
    var i, v, a, r1;

    ctx.beginPath();
    for (i = 0; i <= N; i++){
      v = soft[i % N];
      a = -spin * 0.6 + (i / N) * TAU;
      r1 = R + v * span * 0.95;
      if (i === 0) ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      else ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
    }
    ctx.closePath();
    /* three passes of the same path, widest and faintest first. a blurred
       stroke looks marginally softer and costs about forty times as much. */
    var wide = 1 + bump * 1.5 + burst * 2.4;
    ctx.strokeStyle = rgba(mix(GOLD, GOLD_HOT, 0.6), 1);
    ctx.globalAlpha = warm * hush * 0.13;
    ctx.lineWidth = 11 * wide; ctx.stroke();
    ctx.globalAlpha = warm * hush * 0.22;
    ctx.lineWidth = 4.5 * wide; ctx.stroke();
    ctx.globalAlpha = warm * hush;
    ctx.lineWidth = 2.3; ctx.stroke();

    ctx.globalAlpha = warm * hush * 0.4;
    ctx.beginPath();
    for (i = 0; i <= N; i++){
      v = soft[i % N];
      a = -spin * 0.6 + (i / N) * TAU;
      r1 = R - v * span * 0.42;
      if (i === 0) ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      else ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
    }
    ctx.closePath();
    ctx.strokeStyle = rgba(GOLD_HOT, 0.9);
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---- act one only: the picture comes apart on a hard kick ---- */
  function tear(power){
    var n = 2 + (power * 5) | 0;
    for (var i = 0; i < n; i++){
      var y = Math.random() * H;
      var h = 5 + Math.random() * 46;
      var dx = (Math.random() - 0.5) * 95 * power;
      ctx.drawImage(canvas,
        0, y * dpr, canvas.width, h * dpr,
        dx, y, W, h);
    }
  }

  function ground(alpha){
    var cx = W / 2, cy = H * 0.46;
    var core = mix(mix([30, 5, 6], [70, 10, 8], heat), [16, 12, 5], warm);
    /* the fade and the vignette in one pass. they were two full screen
       gradients doing the same fill twice. */
    var edge = mix(INK, INK_WARM, warm);
    var dark = Math.min(1, alpha + 0.30 + heat * 0.34 - warm * 0.24);
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.8);
    g.addColorStop(0, rgba(core, alpha));
    g.addColorStop(0.34, rgba(edge, alpha * 0.97));
    g.addColorStop(1, rgba(edge, dark));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }



  /* ================= the loop ================= */
  var last = 0, spin = 0, rayspin = 0, now8 = 0;

  /* if a machine cannot keep up, take things away from it rather than
     letting the whole thing crawl */
  var ema = 0.016, slow = 0;

  function frame(ms){
    requestAnimationFrame(frame);
    now8 = ms / 1000;
    var dt = last ? Math.min(now8 - last, 0.05) : 0.016;
    last = now8;
    ema = ema * 0.94 + dt * 0.06;
    slow = ema > 0.026 ? Math.min(1, slow + dt * 0.6) : Math.max(0, slow - dt * 0.25);

    var t = audio.currentTime;
    state(t, dt);
    readBands();
    beats(t);

    var cx = W / 2, cy = H * 0.46;
    var R = Math.min(W, H) * 0.215;
    var span = Math.min(W, H) * 0.15;

    var since = t - kickAt;
    var bump = since >= 0 && since < 0.30
      ? Math.pow(1 - since / 0.30, 2.2) * kickHard * hush : 0;

    if (blackout > 0){
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
      blackout = 0;
    }

    /* trails, and the screen clears itself when the music stops */
    ground(0.26 + bump * 0.09 + (1 - hush) * 0.34 + warm * 0.06);

    spin    += dt * (0.05 + heat * 0.30 + warm * 0.02);
    rayspin += dt * (0.035 + burst * 0.5);

    /* ---------------- the curse ---------------- */
    if (warm < 0.999){
      cross(cx, cy, Math.min(W, H) * 0.72, bump);
      shardRing(cx, cy, R, span, bump);
    }

    /* ---------------- the light ---------------- */
    if (warm > 0.001){
      halo(cx, cy, R, bump);
      godRays(cx, cy, R, bump);
      rose(cx, cy, R, bump);
      if (warm >= 0.999) cross(cx, cy, Math.min(W, H) * 0.72, bump);
      lightRing(cx, cy, R, span, bump);
    }

    /* four seconds of nothing, with one thing in it. still the old colour:
       nothing has turned yet. */
    if (hush < 0.6 && t > T.cut && t < T.back + 1.4){
      var seed = (1 - hush) * ease((t - T.cut) / 2.4);
      ctx.globalCompositeOperation = 'lighter';
      var sd = ctx.createRadialGradient(cx, cy, 0, cx, cy, 7 + seed * 110);
      sd.addColorStop(0,    rgba([255, 214, 200], 0.85 * seed));
      sd.addColorStop(0.18, rgba(RED_HOT, 0.22 * seed));
      sd.addColorStop(1,    rgba(RED, 0));
      ctx.fillStyle = sd;
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'source-over';
    }

    /* shockwaves: walls in act one, ripples of light in act two */
    var i, s;
    for (i = waves.length - 1; i >= 0; i--){
      s = waves[i];
      s.r += dt * Math.min(W, H) * (s.holy ? 2.4 : (s.bar ? 0.62 : 0.92) + s.hard * 0.5);
      s.life -= dt * (s.holy ? 0.55 : (s.bar ? 1.3 : 1.8));
      if (s.life <= 0){ waves.splice(i, 1); continue; }
      ctx.globalCompositeOperation = warm > 0.5 || s.holy ? 'lighter' : 'source-over';
      ctx.globalAlpha = s.life * s.life * (s.holy ? 0.7 : s.bar ? 0.5 : 0.32) * hush;
      ctx.strokeStyle = rgba(s.holy ? GOLD_HOT : mix(RED_HOT, GOLD, warm), 1);
      ctx.lineWidth = s.holy ? 3
        : ((1 - warm) * (1 + s.hard * 3.4) + warm * 1.1) * (s.bar ? 1.5 : 0.7);
      ctx.beginPath(); ctx.arc(cx, cy, R + s.r, 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

    /* act two borrows osu approach circles, which is what it sounds like */
    for (i = circles.length - 1; i >= 0; i--){
      var c = circles[i];
      c.t += dt;
      var k = c.t / c.dur;
      ctx.globalCompositeOperation = 'lighter';
      if (k >= 1){
        c.pop += dt * 4;
        if (c.pop >= 1){ circles.splice(i, 1); ctx.globalCompositeOperation = 'source-over'; continue; }
        ctx.globalAlpha = (1 - c.pop) * 0.9 * warm;
        ctx.strokeStyle = rgba(GOLD_HOT, 1);
        ctx.lineWidth = 2.4 * (1 - c.pop);
        ctx.beginPath(); ctx.arc(c.x, c.y, 17 + c.pop * 40, 0, TAU); ctx.stroke();
      } else {
        ctx.globalAlpha = 0.75 * warm;
        ctx.strokeStyle = rgba(GOLD, 1);
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(c.x, c.y, 17 + (1 - k) * 46, 0, TAU); ctx.stroke();
        ctx.globalAlpha = 0.35 * warm * k;
        ctx.beginPath(); ctx.arc(c.x, c.y, 17, 0, TAU);
        ctx.strokeStyle = rgba(GOLD_HOT, 1); ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.globalAlpha = 1;

    /* the cuts */
    for (i = slashes.length - 1; i >= 0; i--){
      var sl = slashes[i];
      sl.t += dt;
      if (sl.t >= sl.dur){ slashes.splice(i, 1); continue; }
      drawSlash(sl);
    }

    /* shrapnel off the hard kicks in the drop */
    if (heat > 0.4 && bump > 0.55 && !reduce){
      for (i = 0; i < 7; i++) shard(cx, cy, R);
    }
    for (i = shards.length - 1; i >= 0; i--){
      var f = shards[i];
      f.x += f.vx * dt; f.y += f.vy * dt;
      f.vy += 260 * dt; f.a += f.va * dt;
      f.life -= f.decay * dt;
      if (f.life <= 0){ shards.splice(i, 1); continue; }
      ctx.globalAlpha = f.life * 0.8 * hush;
      ctx.strokeStyle = rgba(mix(RED_HOT, EMBER, 1 - f.life), 1);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(f.x, f.y);
      ctx.lineTo(f.x + Math.cos(f.a) * f.len, f.y + Math.sin(f.a) * f.len);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    /* embers go up in the dark, motes come up into the light */
    var want = hush * (0.35 + heat * 2.4 + warm * 0.85) * (reduce ? 0.3 : 1);
    if (Math.random() < want) speck();
    if (Math.random() < want * 0.6) speck();
    ctx.globalCompositeOperation = 'lighter';
    for (i = dust.length - 1; i >= 0; i--){
      var d = dust[i];
      d.x += d.vx * dt; d.y += d.vy * dt;
      d.vy += (d.warm ? -3 : 16) * dt;
      d.life -= d.decay * dt;
      if (d.life <= 0 || d.y < -20){ dust.splice(i, 1); continue; }
      ctx.globalAlpha = d.life * (d.warm ? 0.5 : 0.6) * hush;
      ctx.fillStyle = rgba(d.warm ? GOLD_HOT : EMBER, 1);
      ctx.beginPath(); ctx.arc(d.x, d.y, d.size, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    /* the waveform, so you can see it is really the track */
    if (analyser && hush > 0.02){
      analyser.getByteTimeDomainData(wave);
      var base = H - 74, amp = 26 * hush * (1 + warm * 0.4);
      ctx.globalAlpha = 0.28 * hush;
      ctx.strokeStyle = rgba(mix(RED, GOLD, warm), 1);
      ctx.lineWidth = 1;
      ctx.beginPath();
      var step = Math.max(1, Math.floor(wave.length / Math.max(W, 1)));
      for (i = 0; i < wave.length; i += step){
        var y = base + ((wave[i] - 128) / 128) * amp;
        var x = (i / wave.length) * W;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    if (t - tearAt >= 0 && t - tearAt < 0.13) tear(0.5 + heat * 0.5);


    /* the flash off a kick, and the three that matter */
    if (bump > 0.02){
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = bump * (0.05 + (1 - warm) * 0.05 + warm * 0.05);
      ctx.fillStyle = rgba(mix(RED_HOT, GOLD_HOT, warm), 1);
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }
    /* The turn. It does not simply go white: a ball of gold opens at the
       middle, gets to the corners in about four tenths of a second, and by
       then it has washed out to white. Then it lets go. */
    var sw = t - swell;
    if (sw >= 0 && sw < 2.1){
      var grow = Math.min(1, Math.pow(sw / 0.42, 0.72));
      var rad = Math.min(W, H) * 0.10 + grow * Math.max(W, H) * 1.2;
      var hold = sw < 0.42 ? 1 : Math.pow(1 - (sw - 0.42) / 1.68, 2.0);
      ctx.globalCompositeOperation = 'lighter';
      var sg = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
      sg.addColorStop(0,    rgba(WHITE, hold));
      sg.addColorStop(0.42, rgba(GOLD_HOT, 0.92 * hold));
      sg.addColorStop(0.78, rgba(GOLD, 0.42 * hold));
      sg.addColorStop(1,    rgba(GOLD, 0));
      ctx.fillStyle = sg;
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'source-over';
    }

    for (i = flashes.length - 1; i >= 0; i--){
      var fl = flashes[i];
      var k2 = (t - fl.t) / fl.dur;
      if (k2 < 0 || k2 >= 1){ flashes.splice(i, 1); continue; }
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = Math.min(1, Math.pow(1 - k2, 3.0) * fl.power);
      ctx.fillStyle = rgba(fl.c, 1);
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }

    hud(t);
  }

  /* ================= hud ================= */
  var lastShown = -1;
  function hud(t){
    var p = Math.max(0, Math.min(1, t / T.dur));
    fill.style.width = (p * 100) + '%';
    head.style.left = (p * 100) + '%';
    var s = t | 0;
    if (s !== lastShown){
      lastShown = s;
      clock.textContent = (s / 60 | 0) + ':' + ('0' + (s % 60)).slice(-2);
      bar.setAttribute('aria-valuenow', String(s));
    }
  }

  /* Held back nine tenths of a second so it lands as the white lets go
     rather than inside it, and cleared on a seek so it cannot be left
     hanging there by somebody scrubbing the bar. */
  var achEl = document.getElementById('ach'), achIn, achOut;
  var achSfx = document.getElementById('achSfx');

  function achSound(){
    if (!achSfx) return;
    try {
      achSfx.currentTime = 0;
      achSfx.volume = 0.85;
      var pr = achSfx.play();
      if (pr && pr.catch) pr.catch(function(){});
    } catch (e){}
  }

  function achieve(){
    if (!achEl) return;
    clearTimeout(achIn); clearTimeout(achOut);
    achIn = setTimeout(function(){
      achEl.classList.add('up');
      achSound();
      achOut = setTimeout(function(){ achEl.classList.remove('up'); }, 5400);
    }, 900);
  }

  function achHide(){
    clearTimeout(achIn); clearTimeout(achOut);
    if (achEl) achEl.classList.remove('up');
  }

  window.__ach = { sound: achSound, el: function(){ return achSfx; } };

  function jumped(){
    achHide();
    lastBeat = -1e9;
    kickAt = -9; kickHard = 0; tearAt = -9;
    waves.length = circles.length = dust.length = shards.length = 0;
    slashes.length = 0;
    flashes.length = 0;
    burst = 0; swell = -9;
    fired = {};
  }

  bar.addEventListener('click', function(e){
    var r = bar.getBoundingClientRect();
    audio.currentTime = Math.max(0, Math.min(T.dur - 0.05,
      ((e.clientX - r.left) / r.width) * T.dur));
    jumped();
  });
  bar.addEventListener('keydown', function(e){
    var d = e.key === 'ArrowRight' ? 5 : e.key === 'ArrowLeft' ? -5 : 0;
    if (!d) return;
    e.preventDefault();
    audio.currentTime = Math.max(0, Math.min(T.dur - 0.05, audio.currentTime + d));
    jumped();
  });

  function toggle(){
    if (audio.paused){
      if (actx && actx.state === 'suspended') actx.resume();
      audio.play();
    } else audio.pause();
  }
  pp.addEventListener('click', toggle);
  audio.addEventListener('play',  function(){ document.body.classList.add('going'); });
  audio.addEventListener('pause', function(){ document.body.classList.remove('going'); });
  document.addEventListener('keydown', function(e){
    if (e.code === 'Space' && e.target === document.body){ e.preventDefault(); toggle(); }
  });

  /* the furniture gets out of the way if you leave it alone */
  var idleTimer;
  function stir(){
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){ document.body.classList.add('idle'); }, 2600);
  }
  document.addEventListener('mousemove', stir);
  document.addEventListener('touchstart', stir);

  document.getElementById('start').addEventListener('click', function(){
    listen();
    if (actx && actx.state === 'suspended') actx.resume();
    audio.play();
    gate.classList.add('gone');
    setTimeout(function(){ gate.style.display = 'none'; }, 1000);
    stir();
  });

  window.__an = {
    T: T,
    grid: GRID,
    beat: function(){ return { at: kickAt, hard: +kickHard.toFixed(3), n: lastBeat }; },
    at: function(t){
      state(t);
      return { phase: phase, warm: +warm.toFixed(3), hush: +hush.toFixed(3),
               heat: +heat.toFixed(3), lvl: +lvl.toFixed(2),
               burst: +burst.toFixed(3), flashes: flashes.length,
               slashes: slashes.length };
    }
  };

  document.body.classList.add('act1');
  size();
  requestAnimationFrame(frame);

  /* the front page opens this in a frame and keeps its own arrow */
  try { if (window.top !== window.self) document.querySelector('.backlink').remove(); }
  catch(e){}
})();
</script>
</body>
</html>
