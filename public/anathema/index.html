<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="The sentence, read out in full. Three minutes and twenty two seconds, and it does not stay like this.">
<meta name="theme-color" content="#07050A">
<meta property="og:type" content="website">
<meta property="og:title" content="Anathema">
<meta property="og:description" content="A sentence read out in full, and what was still standing afterwards.">
<meta property="og:url" content="https://shaiyex.com/anathema/">
<meta name="twitter:card" content="summary">
<title>Anathema</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=Grenze+Gotisch:wght@600;800&family=JetBrains+Mono:wght@400;700&display=swap">

<style>
  :root{
    --ink:#07050A;
    --red:#C21A12;
    --red-hot:#F0342A;
    --bone:#E4D8CC;
    --dim:#7C6F68;
    --gold:#F0C868;
    --gold-hot:#FFE9B0;
    --cream:#FFF6E4;

    /* the page reads these. everything else is a transition off them. */
    --edge:#3A1210;
    --key:var(--red);
    --key-hot:var(--red-hot);
    --say:var(--bone);

    --display:"Grenze Gotisch","Pirata One",serif;
    --body:"Archivo","Segoe UI",Helvetica,Arial,sans-serif;
    --mono:"JetBrains Mono",Consolas,ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;overflow:hidden;
    background:var(--ink);color:var(--say);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
    /* every colour on the page moves together, and slowly */
    transition:color 2.4s ease;
  }

  /* the four states of the night. the canvas lerps on its own clock, this is
     only for the things made of html. */
  body.act2, body.outro{
    --edge:#3B2A0C;
    --key:var(--gold);
    --key-hot:var(--gold-hot);
    --say:var(--cream);
  }

  #viz{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

  /* ---------- the words ---------- */
  .words{
    position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);
    z-index:2;width:min(92vw, 34rem);text-align:center;
    pointer-events:none;
  }
  .say{
    margin:0;
    font-family:var(--display);
    font-weight:600;font-size:clamp(23px,4.4vw,40px);
    line-height:1.16;letter-spacing:.005em;
    color:var(--say);
    text-shadow:0 0 30px rgba(0,0,0,.9), 0 2px 0 rgba(0,0,0,.7);
    opacity:0;
    transition:opacity .34s ease, transform .34s ease;
    transform:translateY(6px);
  }
  .say.on{opacity:1;transform:none}

  /* small mono, for the parts that are stage directions */
  .say.k{
    font-family:var(--mono);font-weight:700;
    font-size:clamp(10px,1.5vw,12.5px);
    letter-spacing:.26em;text-transform:uppercase;
    color:var(--key);
    text-shadow:0 0 22px rgba(0,0,0,.9);
  }
  /* the one word the whole first half is walking towards */
  .say.big{
    font-weight:800;font-size:clamp(44px,12vw,124px);
    line-height:.92;letter-spacing:.02em;
    color:#FFF;
    text-shadow:0 0 46px rgba(240,52,42,.75), 0 0 120px rgba(194,26,18,.6);
  }
  /* after the turn the lettering stops being a decree and starts being a person */
  body.act2 .say, body.outro .say{
    font-family:var(--body);font-weight:500;
    font-size:clamp(21px,3.7vw,34px);line-height:1.3;
    letter-spacing:-.005em;
    text-shadow:0 0 34px rgba(0,0,0,.85);
  }
  body.act2 .say.k, body.outro .say.k{
    font-family:var(--mono);font-weight:700;
    font-size:clamp(10px,1.5vw,12.5px);letter-spacing:.26em;
  }
  body.outro .say.big{
    font-family:var(--body);font-weight:700;
    font-size:clamp(38px,9vw,86px);letter-spacing:.14em;
    color:var(--cream);
    text-shadow:0 0 44px rgba(240,200,104,.6), 0 0 130px rgba(240,200,104,.35);
  }

  /* ---------- the cross, which starts the wrong way up ---------- */
  .cross{
    position:fixed;left:50%;top:clamp(26px,7vh,64px);
    z-index:2;width:3px;height:64px;margin-left:-1.5px;
    background:var(--key);
    box-shadow:0 0 16px var(--key);
    transform:rotate(180deg);
    transform-origin:50% 50%;
    transition:transform 1.4s cubic-bezier(.22,1.15,.35,1),
               background 2.4s ease, box-shadow 2.4s ease, opacity .8s ease;
    opacity:.85;
  }
  .cross::before{
    content:"";position:absolute;left:50%;top:17px;
    margin-left:-14px;width:29px;height:3px;
    background:inherit;box-shadow:inherit;
  }
  body.act2 .cross, body.outro .cross{transform:rotate(0deg);opacity:1}
  body.cut .cross{opacity:.12}

  /* ---------- the bar along the bottom ---------- */
  .hud{
    position:fixed;left:0;right:0;bottom:0;z-index:3;
    display:flex;align-items:center;gap:12px;
    padding:12px clamp(12px,3vw,22px) 14px;
    font-family:var(--mono);font-size:10px;font-weight:700;
    letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
    background:linear-gradient(180deg, rgba(7,5,10,0), rgba(7,5,10,.88) 46%);
  }
  .pp{
    flex:0 0 auto;width:30px;height:30px;padding:0;cursor:pointer;
    background:transparent;border:1px solid var(--edge);border-radius:2px;
    color:var(--key);
    display:flex;align-items:center;justify-content:center;
    transition:border-color .4s ease, color 2.4s ease, background .25s ease;
  }
  .pp:hover{background:rgba(255,255,255,.05);border-color:var(--key)}
  .pp b{display:block;width:0;height:0;
        border-left:9px solid currentColor;border-top:6px solid transparent;
        border-bottom:6px solid transparent;margin-left:2px}
  body.going .pp b{
    width:9px;height:11px;border:0;margin:0;
    background:currentColor;
    box-shadow:inset 3px 0 0 rgba(0,0,0,.85);
  }

  .bar{
    position:relative;flex:1 1 auto;height:20px;cursor:pointer;
    display:flex;align-items:center;
  }
  .bar-track{
    position:relative;width:100%;height:3px;
    background:rgba(255,255,255,.09);overflow:hidden;
  }
  /* the two halves of the night, drawn to scale */
  .bar-act{position:absolute;top:0;bottom:0}
  .bar-a1{background:rgba(194,26,18,.34)}
  .bar-a2{background:rgba(240,200,104,.28)}
  .bar-gap{background:rgba(255,255,255,.05)}
  .bar-fill{
    position:absolute;left:0;top:0;bottom:0;width:0;
    background:var(--key-hot);
    box-shadow:0 0 12px var(--key-hot);
  }
  .bar-head{
    position:absolute;top:50%;width:2px;height:13px;margin-top:-6.5px;
    background:var(--say);opacity:.85;pointer-events:none;
  }
  .t{flex:0 0 auto;font-variant-numeric:tabular-nums;letter-spacing:.1em}

  .backlink{
    position:fixed;top:14px;left:14px;z-index:4;
    font-family:var(--mono);font-size:10px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim);text-decoration:none;
    padding:7px 11px 8px;border:1px solid var(--edge);border-radius:2px;
    background:rgba(7,5,10,.72);
    transition:color .25s ease, border-color .4s ease;
  }
  .backlink:hover{color:var(--say);border-color:var(--key)}

  .credit{
    position:fixed;top:16px;right:16px;z-index:4;text-align:right;
    font-family:var(--mono);font-size:9.5px;font-weight:700;
    letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
    line-height:1.9;pointer-events:none;
  }
  .credit b{color:var(--key);font-weight:700;transition:color 2.4s ease}

  /* ---------- the seal you have to break ---------- */
  .gate{
    position:fixed;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;padding:24px;text-align:center;
    background:radial-gradient(70% 55% at 50% 42%, #140708, #07050A 74%);
    transition:opacity .7s ease;
  }
  .gate.gone{opacity:0;pointer-events:none}
  .gate .cross-still{
    position:relative;width:3px;height:78px;background:var(--red);
    box-shadow:0 0 22px rgba(194,26,18,.85);transform:rotate(180deg);
  }
  .gate .cross-still::before{
    content:"";position:absolute;left:50%;top:21px;margin-left:-17px;
    width:35px;height:3px;background:inherit;box-shadow:inherit;
  }
  .gate h1{
    margin:0;font-family:var(--display);font-weight:800;
    font-size:clamp(46px,13vw,132px);line-height:.9;letter-spacing:.03em;
    color:#F2E6DA;
    text-shadow:0 0 40px rgba(194,26,18,.55), 0 3px 0 #07050A;
  }
  .gate .sub{
    margin:0;max-width:34rem;color:var(--dim);
    font-size:15.5px;line-height:1.6;
  }
  .gate .sub b{color:var(--bone);font-weight:500}
  .gate .meta{
    margin:0;font-family:var(--mono);font-size:10px;font-weight:700;
    letter-spacing:.24em;text-transform:uppercase;color:#6A5A55;
  }
  .gate button{
    margin-top:6px;cursor:pointer;
    font-family:var(--mono);font-size:11px;font-weight:700;
    letter-spacing:.2em;text-transform:uppercase;
    color:#07050A;background:var(--red-hot);
    border:1px solid #FF6A5E;border-radius:2px;
    padding:14px 30px 15px;
    transition:background .2s ease, transform .1s ease;
  }
  .gate button:hover{background:#FF5347}
  .gate button:active{transform:translateY(2px)}
  .gate button:focus-visible{outline:2px solid var(--gold);outline-offset:4px}

  @media (max-width:560px){
    .credit{display:none}
    .words{top:42%;width:min(94vw,26rem)}
  }
</style>
</head>
<body>

<canvas id="viz" aria-hidden="true"></canvas>

<i class="cross" id="cross" aria-hidden="true"></i>

<div class="words">
  <p class="say" id="say" aria-live="polite"></p>
</div>

<a class="backlink" href="/">&larr; shaiyex.com</a>

<p class="credit">ANATHEMA<br><b>zdoobz</b></p>

<div class="hud">
  <button class="pp" id="pp" type="button" aria-label="Play or pause"><b></b></button>
  <div class="bar" id="bar" role="slider" tabindex="0"
       aria-label="Position" aria-valuemin="0" aria-valuemax="202" aria-valuenow="0">
    <div class="bar-track">
      <i class="bar-act bar-a1" id="segA"></i>
      <i class="bar-act bar-gap" id="segG"></i>
      <i class="bar-act bar-a2" id="segB"></i>
      <i class="bar-fill" id="fill"></i>
    </div>
    <i class="bar-head" id="head"></i>
  </div>
  <span class="t" id="clock">0:00</span>
</div>

<div class="gate" id="gate">
  <i class="cross-still" aria-hidden="true"></i>
  <h1>Anathema</h1>
  <p class="sub">A formal curse. The bit where the church writes your name down, reads it out, and takes the Light back off you in front of everybody.
    <b>Three minutes and twenty two seconds.</b> It does not stay like this.</p>
  <p class="meta">Headphones &middot; it gets loud once</p>
  <button id="start" type="button">Break the seal</button>
</div>

<audio id="track" src="track.mp3" preload="auto"></audio>

<script>
(function(){
  "use strict";

  /* ------------------------------------------------------------------
     Times measured off the file that ships, not off the download. If the
     track is ever re-encoded these move, so they live in one place.
     ------------------------------------------------------------------ */
  var T = {
    open:    12.02,   /* the first section arrives */
    drop:    63.02,   /* the hardcore. centroid falls off a cliff here */
    cut:     85.69,   /* everything stops. four seconds of actual nothing */
    back:    89.90,   /* it comes back, quietly */
    bright: 113.50,   /* the turn. this is the whole reason for the page */
    outro:  186.33,
    end:    198.50,
    dur:    202.57
  };

  /* time, text, kind. shown until the next one. */
  var SCRIPT = [
    [ 12.0, 'In the matter of the Holy Paladin', 'k'],
    [ 16.4, 'The charge is heresy'],
    [ 22.0, 'For healing people who had not earned it'],
    [ 28.0, 'For interrupting what was not hers to interrupt'],
    [ 34.0, 'For being right about the pull'],
    [ 40.0, 'And for saying so'],
    [ 46.0, 'The Light is withdrawn'],
    [ 52.0, 'The name is struck from the roll'],
    [ 57.4, 'The sentence is', 'k'],

    [ 63.0, 'ANATHEMA', 'big'],
    [ 68.2, 'Cast out'],
    [ 72.4, 'Unnamed'],
    [ 76.6, 'Unmourned'],
    [ 80.8, 'Unmade'],
    [ 84.4, '', 'none'],

    [ 86.4, 'And then nothing happened'],

    [ 90.6, 'No thunder. No hand out of the clouds.'],
    [ 96.6, 'Just a Tuesday, and a group that needed a healer.'],
    [103.0, 'So I went.'],
    [109.6, 'Here is the part nobody warns you about', 'k'],

    [114.2, 'The Light came anyway'],
    [124.0, 'It was never theirs to take'],
    [136.0, 'It answers to the hands'],
    [144.0, 'Not to the roll'],
    [154.0, 'You can put it in writing'],
    [164.0, 'You can read it out'],
    [174.0, 'Somebody still has to keep five people alive'],

    [186.4, 'SHAIYEX', 'big'],
    [191.6, 'Still healing. Still not sorry.'],
    [197.6, '', 'none']
  ];

  var audio  = document.getElementById('track');
  var canvas = document.getElementById('viz');
  var sayEl  = document.getElementById('say');
  var gate   = document.getElementById('gate');
  var start  = document.getElementById('start');
  var pp     = document.getElementById('pp');
  var bar    = document.getElementById('bar');
  var fill   = document.getElementById('fill');
  var head   = document.getElementById('head');
  var clock  = document.getElementById('clock');
  var ctx    = canvas.getContext('2d', { alpha: false });

  var reduce = window.matchMedia &&
               window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------------- the bar knows the shape of the track ---------------- */
  (function segments(){
    var pct = function(a, b){ return ((b - a) / T.dur * 100) + '%'; };
    var at  = function(a){ return (a / T.dur * 100) + '%'; };
    var a = document.getElementById('segA');
    var g = document.getElementById('segG');
    var b = document.getElementById('segB');
    a.style.left = '0';           a.style.width = pct(0, T.cut);
    g.style.left = at(T.cut);     g.style.width = pct(T.cut, T.bright);
    b.style.left = at(T.bright);  b.style.width = pct(T.bright, T.dur);
  })();

  /* ---------------- audio graph ---------------- */
  var actx, analyser, freq, wave, srcNode;

  function listen(){
    if (actx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    analyser = actx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.72;
    freq = new Uint8Array(analyser.frequencyBinCount);
    wave = new Uint8Array(analyser.fftSize);
    srcNode = actx.createMediaElementSource(audio);
    srcNode.connect(analyser);
    analyser.connect(actx.destination);
    bands();   /* only now are there bins to split up */
  }

  /* ---------------- bands ---------------- */
  var N = 0, edges = [], level = [], peak = [], soft = [];

  function bands(){
    N = window.innerWidth < 620 ? 64 : 104;
    edges = [];
    level = new Float32Array(N);
    peak  = new Float32Array(N);
    soft  = new Float32Array(N);
    if (!analyser) return;
    /* log spaced from about 40 Hz to about 11 kHz */
    var bins = analyser.frequencyBinCount;
    var lo = 2, hi = Math.min(bins - 1, 512);
    for (var i = 0; i <= N; i++){
      edges.push(Math.round(lo * Math.pow(hi / lo, i / N)));
    }
  }

  function readBands(){
    if (!analyser) return;
    analyser.getByteFrequencyData(freq);
    for (var i = 0; i < N; i++){
      var a = edges[i], b = Math.max(edges[i + 1], a + 1), m = 0;
      for (var j = a; j < b; j++) if (freq[j] > m) m = freq[j];
      /* the top end is always quieter, so tilt it up, but not so far that
         everything sits at the ceiling and the ring stops having a shape */
      var v = (m / 255) * (0.60 + 0.58 * (i / N));
      v = Math.pow(v > 1 ? 1 : v, 1.34);
      level[i] += (v - level[i]) * 0.42;
      peak[i] = Math.max(peak[i] * 0.94, level[i]);
    }
    /* act two wants a curve, not a comb */
    for (i = 0; i < N; i++){
      soft[i] = (level[(i + N - 1) % N] + 2 * level[i] + level[(i + 1) % N]) * 0.25;
    }
  }

  /* ---------------- the kick, watching the rise not the level ----------------
     A limited master sits near the ceiling the whole time, so comparing the
     low band against its own average finds nothing. The jump finds everything. */
  var lowPrev = 0, rise = 0, lastKick = -9, kickAt = -9, kickHard = 0;
  var fluxPrev = 0, fluxRise = 0, lastOnset = -9;

  function energy(a, b){
    if (!analyser) return 0;
    var s = 0, n = 0;
    for (var i = a; i < b; i++){ s += freq[i]; n++; }
    return n ? (s / n) / 255 : 0;
  }

  function transients(now){
    var raw = energy(1, 8);                 /* about 20 to 170 Hz */
    var d = raw - lowPrev; lowPrev = raw;
    if (d < 0) d = 0;
    rise = rise * 0.94 + d * 0.06;
    if (d > Math.max(rise * 2.2, 0.010) && raw > 0.14 && now - lastKick > 0.20){
      lastKick = now;
      kickAt = now;
      kickHard = Math.max(0.25, Math.min(1, d / Math.max(0.035, rise * 8)));
      boom();
    }

    var full = energy(8, 260);
    var fd = full - fluxPrev; fluxPrev = full;
    if (fd < 0) fd = 0;
    fluxRise = fluxRise * 0.93 + fd * 0.07;
    if (fd > Math.max(fluxRise * 2.4, 0.012) && now - lastOnset > 0.16){
      lastOnset = now;
      return true;
    }
    return false;
  }

  /* ---------------- things that live for a moment ---------------- */
  var waves = [], circles = [], dust = [];

  function boom(){
    if (hush < 0.2) return;
    waves.push({ r: 0, life: 1, hard: kickHard });
    if (waves.length > 14) waves.shift();
  }

  function hit(w, h){
    if (circles.length > 7) return;
    /* out at the edges, never over the words */
    var ang = Math.random() * Math.PI * 2;
    var rad = Math.min(w, h) * (0.34 + Math.random() * 0.16);
    var x = w / 2 + Math.cos(ang) * rad * (w > h ? 1.5 : 1);
    var y = h * 0.44 + Math.sin(ang) * rad;
    circles.push({
      x: Math.max(46, Math.min(w - 46, x)),
      y: Math.max(46, Math.min(h - 110, y)),
      t: 0, dur: 0.62, pop: 0
    });
  }

  function speck(w, h, warm){
    if (dust.length > (reduce ? 40 : 150)) return;
    if (warm > 0.5){
      dust.push({ x: Math.random() * w, y: h + 10,
                  vx: (Math.random() - 0.5) * 10, vy: -14 - Math.random() * 26,
                  life: 1, decay: 0.14 + Math.random() * 0.12,
                  size: 0.8 + Math.random() * 1.9, warm: 1 });
    } else {
      dust.push({ x: w / 2 + (Math.random() - 0.5) * w * 0.9, y: h * 0.9,
                  vx: (Math.random() - 0.5) * 26, vy: -30 - Math.random() * 70,
                  life: 1, decay: 0.3 + Math.random() * 0.25,
                  size: 0.9 + Math.random() * 1.6, warm: 0 });
    }
  }

  /* ---------------- colour ---------------- */
  function mix(a, b, t){
    return [a[0] + (b[0] - a[0]) * t,
            a[1] + (b[1] - a[1]) * t,
            a[2] + (b[2] - a[2]) * t];
  }
  function rgba(c, a){
    return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')';
  }
  var RED = [194, 26, 18], RED_HOT = [255, 120, 96];
  var GOLD = [240, 200, 104], GOLD_HOT = [255, 244, 216];
  var INK = [7, 5, 10], INK_WARM = [12, 9, 7];

  /* ---------------- the state of the night ---------------- */
  var warm = 0;   /* 0 red, 1 gold */
  var hush = 1;   /* 1 alive, 0 the cut */
  var heat = 0;   /* how hard the drop is hitting */
  var cued = -1;
  var phase = '';

  function ease(x){ return x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x); }

  function clockOf(t){
    /* the page has four moods and it is worth naming them */
    if (t >= T.outro) return 'outro';
    if (t >= T.bright) return 'act2';
    if (t >= T.cut && t < T.back) return 'cut';
    return 'act1';
  }

  function state(t){
    warm = ease((t - T.bright) / 7);
    /* the four seconds of nothing, plus a beat either side */
    hush = 1;
    if (t > T.cut - 0.12 && t < T.back + 0.9){
      hush = 1 - ease((t - (T.cut - 0.12)) / 0.5);
      if (t > T.back) hush = ease((t - T.back) / 0.9);
    }
    heat = 0;
    if (t >= T.drop && t < T.cut) heat = ease((t - T.drop) / 1.2);

    var p = clockOf(t);
    if (p !== phase){
      document.body.classList.remove('act1', 'cut', 'act2', 'outro');
      document.body.classList.add(p);
      phase = p;
    }

    var i = -1;
    for (var k = 0; k < SCRIPT.length; k++) if (t >= SCRIPT[k][0]) i = k;
    if (i !== cued){
      cued = i;
      show(i < 0 ? null : SCRIPT[i]);
    }
  }

  var swapping = 0;
  function show(line){
    clearTimeout(swapping);
    sayEl.classList.remove('on');
    swapping = setTimeout(function(){
      if (!line || line[2] === 'none'){ sayEl.textContent = ''; return; }
      sayEl.textContent = line[1];
      sayEl.className = 'say' + (line[2] ? ' ' + line[2] : '');
      /* one frame off, so the transition has something to go from */
      requestAnimationFrame(function(){ sayEl.classList.add('on'); });
    }, 300);
  }

  /* ---------------- canvas ---------------- */
  var W = 0, H = 0, dpr = 1;

  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bands();
  }
  window.addEventListener('resize', size);

  var last = 0, spin = 0;

  function ground(alpha){
    var cx = W / 2, cy = H * 0.44;
    var core = mix([26, 6, 8], [17, 12, 4], warm);
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.78);
    g.addColorStop(0, rgba(mix(core, mix(core, [90, 20, 14], heat), 1), alpha));
    g.addColorStop(0.42, rgba(mix(INK, INK_WARM, warm), alpha * 0.96));
    g.addColorStop(1, rgba(mix(INK, INK_WARM, warm), alpha));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function ring(cx, cy, R, span, bump){
    var key = mix(RED, GOLD, warm);
    var hot = mix(RED_HOT, GOLD_HOT, warm);
    var i, a, v, r1, r2;

    /* act one: hard spikes, the shape of something being taken apart */
    if (warm < 1){
      ctx.globalAlpha = (1 - warm) * hush;
      ctx.lineCap = 'butt';
      for (i = 0; i < N; i++){
        v = level[i];
        a = spin + (i / N) * Math.PI * 2;
        r1 = R;
        r2 = R + v * span * (1 + bump * 0.5);
        ctx.strokeStyle = rgba(mix(key, hot, v * v), 0.28 + v * 0.72);
        ctx.lineWidth = 1.4 + v * 2.4 + heat * 1.2;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
        ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);
        ctx.stroke();
        /* the peak that hangs behind the band, a beat late */
        if (peak[i] > v + 0.06){
          r2 = R + peak[i] * span * (1 + bump * 0.5);
          ctx.globalAlpha = (1 - warm) * hush * 0.4;
          ctx.beginPath();
          ctx.arc(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2, 1.2, 0, 6.284);
          ctx.fillStyle = rgba(hot, 1);
          ctx.fill();
          ctx.globalAlpha = (1 - warm) * hush;
        }
      }
    }

    /* act two: one closed curve, lit from inside */
    if (warm > 0){
      ctx.globalAlpha = warm * hush;
      ctx.beginPath();
      for (i = 0; i <= N; i++){
        v = soft[i % N];
        a = -spin * 0.6 + (i / N) * Math.PI * 2;
        r1 = R + v * span * 0.92;
        if (i === 0) ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
        else ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      }
      ctx.closePath();
      var gg = ctx.createRadialGradient(cx, cy, R * 0.82, cx, cy, R + span);
      gg.addColorStop(0, rgba(GOLD, 0));
      gg.addColorStop(1, rgba(GOLD_HOT, 0.055));
      ctx.fillStyle = gg;
      ctx.fill();
      ctx.strokeStyle = rgba(mix(GOLD, GOLD_HOT, 0.55), 0.95);
      ctx.lineWidth = 1.5;
      ctx.shadowColor = rgba(GOLD, 0.7);
      ctx.shadowBlur = 9 + bump * 13;
      ctx.stroke();
      ctx.shadowBlur = 0;

      /* and its reflection, folded inwards */
      ctx.globalAlpha = warm * hush * 0.34;
      ctx.beginPath();
      for (i = 0; i <= N; i++){
        v = soft[i % N];
        a = -spin * 0.6 + (i / N) * Math.PI * 2;
        r1 = R - v * span * 0.4;
        if (i === 0) ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
        else ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      }
      ctx.closePath();
      ctx.strokeStyle = rgba(GOLD_HOT, 0.8);
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function frame(ms){
    requestAnimationFrame(frame);
    var now = ms / 1000;
    var dt = last ? Math.min(now - last, 0.05) : 0.016;
    last = now;

    var t = audio.currentTime;
    state(t);
    readBands();
    var onset = transients(t);

    var cx = W / 2, cy = H * 0.44;
    var R = Math.min(W, H) * 0.235;
    var span = Math.min(W, H) * 0.15;

    /* the punch, and it is a punch, not a wobble */
    var since = t - kickAt;
    var bump = since >= 0 && since < 0.5
      ? Math.pow(1 - since / 0.5, 2.4) * kickHard * hush : 0;

    ground(0.30 + bump * 0.10 + (1 - hush) * 0.30);

    /* a hole for the words to sit in */
    var hole = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.02);
    hole.addColorStop(0, rgba(mix(INK, INK_WARM, warm), 0.86));
    hole.addColorStop(0.72, rgba(mix(INK, INK_WARM, warm), 0.66));
    hole.addColorStop(1, rgba(mix(INK, INK_WARM, warm), 0));
    ctx.fillStyle = hole;
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.02, 0, 6.284); ctx.fill();

    spin += dt * (0.05 + heat * 0.16 + warm * 0.03);

    ring(cx, cy, R * (1 + bump * 0.03), span, bump);

    /* shockwaves. red ones are walls, gold ones are ripples. */
    for (var i = waves.length - 1; i >= 0; i--){
      var s = waves[i];
      s.r += dt * Math.min(W, H) * (0.7 + s.hard * 0.7);
      s.life -= dt * 1.5;
      if (s.life <= 0){ waves.splice(i, 1); continue; }
      ctx.globalAlpha = s.life * s.life * 0.55 * hush;
      ctx.strokeStyle = rgba(mix(RED_HOT, GOLD, warm), 1);
      ctx.lineWidth = (1 - warm) * (1 + s.hard * 3.4) + warm * 1.1;
      ctx.beginPath(); ctx.arc(cx, cy, R + s.r, 0, 6.284); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    /* act two only: the approach circle, borrowed wholesale from osu */
    if (warm > 0.35 && onset && !reduce) hit(W, H);
    for (i = circles.length - 1; i >= 0; i--){
      var c = circles[i];
      c.t += dt;
      var k = c.t / c.dur;
      if (k >= 1){
        c.pop += dt * 4.2;
        if (c.pop >= 1){ circles.splice(i, 1); continue; }
        ctx.globalAlpha = (1 - c.pop) * 0.85 * warm;
        ctx.strokeStyle = rgba(GOLD_HOT, 1);
        ctx.lineWidth = 2 * (1 - c.pop);
        ctx.beginPath(); ctx.arc(c.x, c.y, 16 + c.pop * 34, 0, 6.284); ctx.stroke();
      } else {
        var rr = 16 + (1 - k) * 42;
        ctx.globalAlpha = 0.72 * warm;
        ctx.strokeStyle = rgba(GOLD, 1);
        ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(c.x, c.y, rr, 0, 6.284); ctx.stroke();
        ctx.globalAlpha = 0.3 * warm * k;
        ctx.beginPath(); ctx.arc(c.x, c.y, 16, 0, 6.284);
        ctx.strokeStyle = rgba(GOLD_HOT, 1); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;

    /* embers going up in act one, motes coming up in act two */
    var want = hush * (0.4 + heat * 2.2 + warm * 0.9) * (reduce ? 0.3 : 1);
    if (Math.random() < want) speck(W, H, warm);
    if (Math.random() < want * 0.5) speck(W, H, warm);
    for (i = dust.length - 1; i >= 0; i--){
      var d = dust[i];
      d.x += d.vx * dt; d.y += d.vy * dt;
      d.vy += (d.warm ? 4 : 16) * dt;
      d.life -= d.decay * dt;
      if (d.life <= 0 || d.y < -20){ dust.splice(i, 1); continue; }
      ctx.globalAlpha = d.life * (d.warm ? 0.75 : 0.6) * hush;
      ctx.fillStyle = rgba(d.warm ? GOLD_HOT : mix(RED_HOT, [255, 190, 120], 0.4), 1);
      ctx.beginPath(); ctx.arc(d.x, d.y, d.size, 0, 6.284); ctx.fill();
    }
    ctx.globalAlpha = 1;

    /* the actual waveform, down at the bottom, so you can see it is real */
    if (analyser && hush > 0.02){
      analyser.getByteTimeDomainData(wave);
      var base = H - 74, amp = 26 * hush;
      ctx.globalAlpha = 0.30 * hush;
      ctx.strokeStyle = rgba(mix(RED, GOLD, warm), 1);
      ctx.lineWidth = 1;
      ctx.beginPath();
      var step = Math.max(1, Math.floor(wave.length / Math.max(W, 1)));
      for (i = 0; i < wave.length; i += step){
        var y = base + ((wave[i] - 128) / 128) * amp;
        var x = (i / wave.length) * W;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    /* the flash off a hard kick, which is all the punch this page needs */
    if (bump > 0.02){
      ctx.globalAlpha = bump * (0.10 + (1 - warm) * 0.08);
      ctx.fillStyle = rgba(mix(RED_HOT, GOLD_HOT, warm), 1);
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }

    hud(t);
  }

  /* ---------------- the bar ---------------- */
  var lastShown = -1;
  function hud(t){
    var p = Math.max(0, Math.min(1, t / T.dur));
    fill.style.width = (p * 100) + '%';
    head.style.left = (p * 100) + '%';
    var s = Math.floor(t);
    if (s !== lastShown){
      lastShown = s;
      clock.textContent = Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
      bar.setAttribute('aria-valuenow', String(s));
    }
  }

  function jumped(){
    lastKick = lastOnset = kickAt = -9;
    lowPrev = rise = fluxPrev = fluxRise = 0;
    waves.length = 0; circles.length = 0; dust.length = 0;
    cued = -2;
  }

  function seek(e){
    var r = bar.getBoundingClientRect();
    var x = (e.clientX - r.left) / r.width;
    audio.currentTime = Math.max(0, Math.min(T.dur - 0.05, x * T.dur));
    jumped();
  }
  bar.addEventListener('click', seek);
  bar.addEventListener('keydown', function(e){
    var d = e.key === 'ArrowRight' ? 5 : e.key === 'ArrowLeft' ? -5 : 0;
    if (!d) return;
    e.preventDefault();
    audio.currentTime = Math.max(0, Math.min(T.dur - 0.05, audio.currentTime + d));
    jumped();
  });

  /* ---------------- going ---------------- */
  function toggle(){
    if (audio.paused){
      if (actx && actx.state === 'suspended') actx.resume();
      audio.play();
    } else {
      audio.pause();
    }
  }
  pp.addEventListener('click', toggle);
  audio.addEventListener('play',  function(){ document.body.classList.add('going'); });
  audio.addEventListener('pause', function(){ document.body.classList.remove('going'); });

  document.addEventListener('keydown', function(e){
    if (e.code === 'Space' && e.target === document.body){
      e.preventDefault(); toggle();
    }
  });

  start.addEventListener('click', function(){
    listen();
    if (actx && actx.state === 'suspended') actx.resume();
    audio.play();
    gate.classList.add('gone');
    setTimeout(function(){ gate.style.display = 'none'; }, 800);
  });

  document.body.classList.add('act1');
  size();
  requestAnimationFrame(frame);

  window.__an = {
    T: T,
    script: SCRIPT,
    at: function(t){
      state(t);
      var line = cued < 0 ? null : SCRIPT[cued];
      return { phase: phase, warm: +warm.toFixed(3), hush: +hush.toFixed(3),
               heat: +heat.toFixed(3), cue: cued, say: line ? line[1] : '' };
    }
  };

  /* the front page opens this in a frame and keeps its own arrow */
  try { if (window.top !== window.self) document.querySelector('.backlink').remove(); }
  catch(e){}
})();
</script>
</body>
</html>
