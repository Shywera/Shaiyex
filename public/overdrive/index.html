<style>
  :root{
    --ink:#03040A;
    --cyan:#38E8FF;
    --amber:#FFB020;
    --red:#FF2D2D;
    --hot:#FFF4E0;
    --dim:#4A5A6E;
    --edge:#141C28;
    --mono:"JetBrains Mono",Consolas,ui-monospace,monospace;
    --disp:"Bebas Neue","Arial Narrow",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;overflow:hidden;background:#000;
    color:var(--dim);font-family:var(--mono);
    -webkit-font-smoothing:antialiased;
  }
  #viz{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

  .hud{
    position:fixed;left:0;right:0;bottom:0;z-index:3;
    display:flex;align-items:center;gap:12px;
    padding:12px clamp(12px,3vw,22px) 14px;
    font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    background:linear-gradient(180deg, rgba(3,4,10,0), rgba(3,4,10,.9) 46%);
    transition:opacity .5s ease;
  }
  body.idle .hud{opacity:.1}
  .hud:hover{opacity:1 !important}
  .pp{
    flex:0 0 auto;width:30px;height:30px;padding:0;cursor:pointer;
    background:transparent;border:1px solid var(--edge);border-radius:2px;
    color:var(--cyan);
    display:flex;align-items:center;justify-content:center;
    transition:border-color .4s ease, color .8s ease, background .25s ease;
  }
  .pp:hover{background:rgba(255,255,255,.06);border-color:var(--cyan)}
  .pp b{display:block;width:0;height:0;
        border-left:9px solid currentColor;border-top:6px solid transparent;
        border-bottom:6px solid transparent;margin-left:2px}
  body.going .pp b{
    width:9px;height:11px;border:0;margin:0;background:currentColor;
    box-shadow:inset 3px 0 0 rgba(0,0,0,.85);
  }

  .bar{position:relative;flex:1 1 auto;height:22px;cursor:pointer;
       display:flex;align-items:center}
  .bar-track{position:relative;width:100%;height:4px;
             background:rgba(255,255,255,.07);overflow:hidden}
  .seg{position:absolute;top:0;bottom:0}
  .bar-fill{position:absolute;left:0;top:0;bottom:0;width:0;
            background:var(--hot);box-shadow:0 0 12px rgba(255,244,224,.8)}
  .bar-head{position:absolute;top:50%;width:2px;height:15px;margin-top:-7.5px;
            background:#FFF;opacity:.85;pointer-events:none}
  .t{flex:0 0 auto;font-variant-numeric:tabular-nums;letter-spacing:.1em}

  .backlink{
    position:fixed;top:14px;left:14px;z-index:4;
    font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim);text-decoration:none;
    padding:7px 11px 8px;border:1px solid var(--edge);border-radius:2px;
    background:rgba(3,4,10,.72);
    transition:color .25s ease, border-color .4s ease, opacity .5s ease;
  }
  .backlink:hover{color:#FFF;border-color:var(--cyan)}
  body.idle .backlink{opacity:.1}
  .backlink:hover{opacity:1}

  .credit{
    position:fixed;top:14px;right:16px;z-index:4;text-align:right;
    pointer-events:none;transition:opacity .5s ease;
  }
  .credit b{
    display:block;font-family:var(--disp);font-size:26px;line-height:.9;
    letter-spacing:.06em;color:#EAF6FF;
    text-shadow:0 2px 16px rgba(0,0,0,.95), 0 0 3px rgba(0,0,0,.8);
  }
  .credit span{
    display:block;font-size:9px;font-weight:700;letter-spacing:.24em;
    text-transform:uppercase;color:#9FB4C8;margin-top:3px;
    text-shadow:0 1px 10px rgba(0,0,0,.95);
  }
  body.idle .credit{opacity:.16}

  .gate{
    position:fixed;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;padding:24px;text-align:center;
    background:radial-gradient(70% 55% at 50% 46%, #0A1020, #000 78%);
    transition:opacity .8s ease;
  }
  .gate.gone{opacity:0;pointer-events:none}
  .gate h1{
    margin:0;font-family:var(--disp);
    font-size:clamp(62px,17vw,220px);line-height:.84;letter-spacing:.02em;
    color:#EAF6FF;
    text-shadow:0 0 40px rgba(56,232,255,.5), 0 0 120px rgba(56,232,255,.22);
    animation:rev 3.4s ease-in-out infinite;
  }
  @keyframes rev{
    0%,100%{text-shadow:0 0 40px rgba(56,232,255,.5), 0 0 120px rgba(56,232,255,.22)}
    50%    {text-shadow:0 0 46px rgba(255,45,45,.55), 0 0 140px rgba(255,176,32,.28)}
  }
  .gate .warn{
    margin:0;font-size:10px;font-weight:700;letter-spacing:.3em;
    text-transform:uppercase;color:var(--red);
  }
  .gate .meta{
    margin:0;font-size:10px;font-weight:700;letter-spacing:.24em;
    text-transform:uppercase;color:#3A4658;
  }
  .gate button{
    margin-top:8px;cursor:pointer;font-family:var(--mono);
    font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;
    color:#03040A;background:var(--cyan);
    border:1px solid #9BF3FF;border-radius:2px;padding:15px 34px 16px;
    transition:background .2s ease, transform .1s ease;
  }
  .gate button:hover{background:#7BEEFF}
  .gate button:active{transform:translateY(2px)}
  .gate button:focus-visible{outline:2px solid var(--red);outline-offset:4px}

  @media (max-width:620px){ .credit b{font-size:18px} }
</style>

<body>

<canvas id="viz" aria-hidden="true"></canvas>

<a class="backlink" href="/">&larr; shaiyex.com</a>
<p class="credit"><b>OVERDRIVE</b><span>210 bpm</span></p>

<div class="hud" id="hud">
  <button class="pp" id="pp" type="button" aria-label="Play or pause"><b></b></button>
  <div class="bar" id="bar" role="slider" tabindex="0"
       aria-label="Position" aria-valuemin="0" aria-valuemax="260" aria-valuenow="0">
    <div class="bar-track" id="bartrack">
      <i class="bar-fill" id="fill"></i>
    </div>
    <i class="bar-head" id="head"></i>
  </div>
  <span class="t" id="clock">0:00</span>
</div>

<div class="gate" id="gate">
  <p class="warn">Redline</p>
  <h1>OVERDRIVE</h1>
  <p class="meta">4:20 &middot; 210 bpm &middot; headphones, and not quietly</p>
  <button id="start" type="button">Send it</button>
</div>

<audio id="track" src="track.mp3" preload="auto"></audio>

<script>
(function(){
  "use strict";

  /* ====================================================================
     OVERDRIVE

     210.0000 bpm exactly. Measured by fitting a comb over the onset
     envelope: at 210 the beat phase that the four loud sections
     independently land on agrees to within 19 ms across 244 seconds, and
     at 209.96 it is 44 ms, which is how you know it is a round number and
     not a near one. First beat at 0.2695 s. The phrase is 8 beats, not 4:
     the low band's 8 beat periodicity scores 35.8 against 1.9 for 4.

     There is one thing on screen for four minutes and twenty seconds: a
     vortex, and you are going down it. It never gets swapped for something
     else. Every section of the track is the same vortex under different
     settings, and the settings are crossfaded, so the shape is always on
     its way somewhere. What snaps on a drop is how hard it is lit and how
     fast it is moving, because that is what a drop actually is.
     ==================================================================== */
  var GRID = { bpm: 210, t0: 0.2695 };
  var SPB  = 60 / GRID.bpm;
  var PHRASE = 8;

  var T = {
    caught: 12.555,   /* beat  43  the engine catches, low band 0.09 -> 0.66 */
    turn:   47.984,   /* beat 167  after a one second hole */
    subIn:  71.984,   /* beat 251  the centroid falls to 771. all sub, no top */
    subOut: 79.984,   /* beat 279  and back up */
    brk:    87.984,   /* beat 307  thin and bright */
    drop1: 114.269,   /* beat 399  DROP ONE. loudest low band in the track */
    out1:  131.984,   /* beat 461 */
    hollow:151.984,   /* beat 531  the emptiest point, low band 0.03 */
    drop2: 167.412,   /* beat 585  DROP TWO, and it is bigger */
    dip:   191.984,   /* beat 671  one bar of air inside it */
    out2:  204.555,   /* beat 715 */
    last:  233.698,   /* beat 817  the final push */
    finish:256.555,   /* beat 897  the body ends */
    dead:  259.000,
    dur:   260.306
  };

  var audio  = document.getElementById('track');
  var canvas = document.getElementById('viz');
  var gate   = document.getElementById('gate');
  var pp     = document.getElementById('pp');
  var bar    = document.getElementById('bar');
  var fill   = document.getElementById('fill');
  var head   = document.getElementById('head');
  var clock  = document.getElementById('clock');
  var ctx    = canvas.getContext('2d', { alpha: false });

  var reduce = window.matchMedia &&
               window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var TAU = Math.PI * 2;

  function clamp(x, a, b){ return x < a ? a : x > b ? b : x; }
  function ease(x){ return x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x); }
  function mix(a, b, t){
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  }
  function rgba(c, a){
    return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')';
  }

  var CYAN = [56, 232, 255], VIOLET = [150, 90, 255], AMBER = [255, 176, 32];
  var RED = [255, 45, 45], PINK = [255, 92, 224];
  var HOT = [255, 244, 224], STEEL = [26, 44, 66], INK = [3, 4, 10];

  /* Hue is one number and it walks a ramp that never passes through grey.
     Interpolating the number is what lets a section change colour on its
     way in rather than at a cut. */
  function ramp(x){
    x = clamp(x, 0, 1);
    if (x < 0.34) return mix(CYAN, VIOLET, x / 0.34);
    if (x < 0.68) return mix(VIOLET, AMBER, (x - 0.34) / 0.34);
    return mix(AMBER, RED, (x - 0.68) / 0.32);
  }

  /* ================= the cross section ================= */
  /* SEG points around the tube. A look stores its own outline as x and y
     offsets rather than as a side count, because two outlines can be
     crossfaded point by point and two side counts cannot. This is what
     lets the tube flatten into a road without anything being swapped. */
  var SEG = 32;

  function shape(o){
    var L = {
      n: 14, flat: 0, rad: 0.30, twist: 1, panel: 1, rail: 0.34,
      spd: 1.6, bh: 1, bv: 1, hue: 0.2, tint: null, tintA: 0,
      heat: 0.5, chroma: 0, star: 0.25, arc: 0, foldA: 0, alphaMul: 1
    };
    for (var key in o) L[key] = o[key];
    L.px = new Float32Array(SEG + 1);
    L.py = new Float32Array(SEG + 1);
    L.alt = new Float32Array(SEG + 1);
    for (var i = 0; i <= SEG; i++){
      var th = (i % SEG) / SEG * TAU;
      var half = Math.PI / L.n;
      var a = ((th % (2 * half)) + 2 * half) % (2 * half) - half;
      var r = Math.cos(half) / Math.cos(a);            /* regular n-gon */
      L.px[i] = Math.cos(th) * r * (1 + L.flat * 2.5);
      L.py[i] = Math.sin(th) * r * (1 - L.flat * 0.62);
      /* one plate per side of the polygon, hard edged. Indexed off the
         facet midpoint rather than off i, so it stays put when SEG and n
         disagree, and it still crossfades between two looks cleanly. */
      L.alt[i] = Math.floor(((i + 0.5) / SEG) * L.n) % 2;
    }
    return L;
  }

  var L_VOID = shape({ n: 12, rad: 0.30, twist: 1, panel: 0, rail: 0.10,
                       spd: 0.26, hue: 0.03, heat: 0.12, star: 0.70, arc: 1,
                       alphaMul: 0.36 });
  var L_RUN  = shape({ n: 16, rad: 0.30, twist: 1, panel: 1, rail: 0.34,
                       spd: 1.64, hue: 0.22, heat: 0.52, star: 0.10,
                       alphaMul: 0.90 });
  var L_ROAD = shape({ n: 10, flat: 0.86, rad: 0.29, twist: 0.14, panel: 1,
                       rail: 0.80, spd: 1.80, bh: 0.55, bv: 0, hue: 0.30,
                       heat: 0.60, star: 0.28, alphaMul: 0.92 });
  var L_SUB  = shape({ n: 6, rad: 0.44, twist: 0.8, panel: 1, rail: 0.50,
                       spd: 0.19, hue: 0.55, tint: RED, tintA: 0.80,
                       heat: 0.80, star: 0.06, alphaMul: 1 });
  var L_BRK  = shape({ n: 22, rad: 0.38, twist: 0.7, panel: 0.16, rail: 0.12,
                       spd: 0.26, hue: 0.12, heat: 0.26, star: 0.60, arc: 1,
                       alphaMul: 0.42 });
  var L_RED  = shape({ n: 14, rad: 0.28, twist: 2.3, panel: 1, rail: 0.62,
                       spd: 2.85, hue: 0.86, heat: 1.00, chroma: 1,
                       star: 0.05, alphaMul: 1 });
  var L_OPEN = shape({ n: 24, rad: 0.52, twist: 0.9, panel: 0.45, rail: 0.30,
                       spd: 1.31, hue: 0.16, heat: 0.34, star: 0.45,
                       alphaMul: 0.60 });
  var L_HOLL = shape({ n: 24, rad: 0.46, twist: 0.4, panel: 0.05, rail: 0.06,
                       spd: 0.24, hue: 0.04, heat: 0.10, star: 0.80, arc: 1,
                       alphaMul: 0.30 });
  var L_KAL  = shape({ n: 7, rad: 0.30, twist: 2.5, panel: 1, rail: 0.55,
                       spd: 3.05, hue: 0.92, tint: PINK, tintA: 0.85,
                       heat: 1.00, chroma: 0.8, star: 0.05, foldA: 1,
                       alphaMul: 1 });
  var L_GLIDE= shape({ n: 5, rad: 0.42, twist: 1.9, panel: 0.74, rail: 0.42,
                       spd: 1.55, hue: 0.46, heat: 0.44, star: 0.32,
                       alphaMul: 0.88 });
  var L_DEAD = shape({ n: 24, rad: 0.40, twist: 0.2, panel: 0.04, rail: 0,
                       spd: 0.046, hue: 0.02, heat: 0, star: 0.35,
                       alphaMul: 0.22 });

  /* mark, look, lead, morph, snap.

     lead is how long before the mark the shape starts moving and morph is
     how long it takes, so a drop is already on its way in while the bar
     before it is still playing. snap is the separate, much shorter window
     used for how hard it is lit, which is the part that is allowed to
     arrive all at once. */
  var ARC = [
    [0,        L_VOID, 0,   0.10, 0.10, 'void'],
    [T.caught, L_RUN,  2.3, 3.4,  0.40, 'run'],
    [T.turn,   L_ROAD, 2.3, 5.0,  1.10, 'road'],
    [T.subIn,  L_SUB,  2.3, 3.4,  0.55, 'sub'],
    [T.subOut, L_RUN,  2.3, 3.4,  0.60, 'run'],
    [T.brk,    L_BRK,  1.7, 3.6,  1.20, 'break'],
    [T.drop1,  L_RED,  4.6, 5.2,  0.16, 'redline'],
    [T.out1,   L_OPEN, 0.9, 4.4,  1.60, 'open'],
    [T.hollow, L_HOLL, 1.7, 4.4,  1.40, 'hollow'],
    [T.drop2,  L_KAL,  4.6, 5.2,  0.16, 'kaleido'],
    [T.dip,    L_RED,  1.7, 2.4,  0.50, 'redline'],
    [T.out2,   L_GLIDE,1.7, 4.2,  1.10, 'glide'],
    [T.last,   L_RED,  2.3, 3.2,  0.24, 'redline'],
    [T.finish, L_OPEN, 0.9, 2.8,  1.20, 'open'],
    [T.dead,   L_DEAD, 0,   3.2,  2.00, 'dead']
  ];

  var SCENE_TINT = ['#1C3A52','#38E8FF','#5AA8FF','#FF2D2D','#38E8FF','#2C4A66',
                    '#FFB020','#8FE8FF','#16222E','#FF5CE0','#FFB020','#B66CFF',
                    '#FFB020','#8FE8FF','#101820'];

  (function segments(){
    var tr = document.getElementById('bartrack');
    for (var i = 0; i < ARC.length; i++){
      var a = ARC[i][0], b = i + 1 < ARC.length ? ARC[i + 1][0] : T.dur;
      var s = document.createElement('i');
      s.className = 'seg';
      s.style.left = (a / T.dur * 100) + '%';
      s.style.width = ((b - a) / T.dur * 100) + '%';
      s.style.background = SCENE_TINT[i];
      s.style.opacity = 0.18 + ARC[i][1].heat * 0.55;
      tr.insertBefore(s, fill);
    }
  })();

  /* ================= audio ================= */
  var actx, analyser, freq;

  function listen(){
    if (actx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    analyser = actx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.58;
    freq = new Uint8Array(analyser.frequencyBinCount);
    actx.createMediaElementSource(audio).connect(analyser);
    analyser.connect(actx.destination);
    bands();
  }

  var N = 0, edges = [], level;

  function bands(){
    N = window.innerWidth < 620 ? 26 : 40;
    level = new Float32Array(N);
    edges = [];
    if (!analyser) return;
    var lo = 2, hi = Math.min(analyser.frequencyBinCount - 1, 460);
    for (var i = 0; i <= N; i++) edges.push(Math.round(lo * Math.pow(hi / lo, i / N)));
  }

  function readBands(){
    if (!analyser || !edges.length) return;
    analyser.getByteFrequencyData(freq);
    for (var i = 0; i < N; i++){
      var a = edges[i], b = Math.max(edges[i + 1], a + 1), m = 0;
      for (var j = a; j < b; j++) if (freq[j] > m) m = freq[j];
      var v = (m / 255) * (0.62 + 0.55 * (i / N));
      level[i] += (Math.pow(v > 1 ? 1 : v, 1.2) - level[i]) * 0.40;
    }
  }

  function band(n){ return level[((n * 2) % N + N) % N]; }

  function energy(a, b){
    if (!analyser) return 0;
    var s = 0;
    for (var i = a; i < b; i++) s += freq[i];
    return (s / (b - a)) / 255;
  }

  /* ================= the blended state ================= */
  var PX = new Float32Array(SEG + 1), PY = new Float32Array(SEG + 1);
  var ALT = new Float32Array(SEG + 1);
  var pyMax = 1;
  var P = { rad: 0.30, twist: 1, panel: 0, rail: 0.1, spd: 0.26, bh: 1, bv: 1,
            hue: 0.03, star: 0.7, arc: 1, foldA: 0, alphaMul: 0.36, flat: 0 };
  var col = CYAN.slice();
  var heat = 0, chroma = 0, rev = 0;
  var sceneName = 'void', sceneIdx = 0, phraseRoot = 0, lastIdx = -1;
  var surge = 0, surgeAt = -9, trans = 0, transDir = 1;

  function state(t, dt){
    var i, iSlow = 0, iFast = 0;
    for (i = 1; i < ARC.length; i++){
      if (t >= ARC[i][0] - ARC[i][2]) iSlow = i;
      if (t >= ARC[i][0]) iFast = i;
    }

    /* shape: a long crossfade that opens before the mark */
    var A = ARC[iSlow === 0 ? 0 : iSlow - 1][1], B = ARC[iSlow][1];
    var raw = iSlow === 0 ? 1
            : clamp((t - (ARC[iSlow][0] - ARC[iSlow][2])) / ARC[iSlow][3], 0, 1);
    var u = ease(raw);
    trans = Math.sin(raw * Math.PI);
    transDir = B.spd >= A.spd ? 1 : -1;

    for (i = 0; i <= SEG; i++){
      PX[i]  = A.px[i]  + (B.px[i]  - A.px[i])  * u;
      PY[i]  = A.py[i]  + (B.py[i]  - A.py[i])  * u;
      ALT[i] = A.alt[i] + (B.alt[i] - A.alt[i]) * u;
    }
    pyMax = 0.001;
    for (i = 0; i < SEG; i++){
      var ay = PY[i] < 0 ? -PY[i] : PY[i];
      if (ay > pyMax) pyMax = ay;
    }
    var keys = ['rad','twist','panel','rail','spd','bh','bv','hue','star',
                'arc','foldA','alphaMul','flat'];
    for (i = 0; i < keys.length; i++){
      var k = keys[i];
      P[k] = A[k] + (B[k] - A[k]) * u;
    }
    var cA = A.tint ? mix(ramp(A.hue), A.tint, A.tintA) : ramp(A.hue);
    var cB = B.tint ? mix(ramp(B.hue), B.tint, B.tintA) : ramp(B.hue);
    col = mix(cA, cB, u);

    /* brightness and grain: the short window, anchored on the mark */
    var C = ARC[iFast === 0 ? 0 : iFast - 1][1], D = ARC[iFast][1];
    var v = iFast === 0 ? 1 : ease((t - ARC[iFast][0]) / ARC[iFast][4]);
    heat   = C.heat   + (D.heat   - C.heat)   * v;
    chroma = C.chroma + (D.chroma - C.chroma) * v;

    if (iFast !== lastIdx){
      if (lastIdx >= 0 && D.heat > C.heat + 0.28) surgeAt = ARC[iFast][0];
      lastIdx = iFast;
      sceneIdx = iFast;
      sceneName = ARC[iFast][5];
      phraseRoot = Math.round((ARC[iFast][0] - GRID.t0) / SPB);
    }
    var sd = t - surgeAt;
    surge = sd >= 0 && sd < 1.6 ? Math.pow(1 - sd / 1.6, 2.4) : 0;

    var target = heat * 0.72 + energy(1, 22) * 0.44;
    rev += (target - rev) * (dt ? clamp(dt * (target > rev ? 9 : 1.5), 0, 1) : 1);
  }

  /* ================= the clock ================= */
  var lastBeat = -1e9, beatAt = -9, beatHard = 0, beatNo = 0;
  var tearAt = -9, chromaAt = -9, blastAt = -9, shake = 0;

  function beats(t){
    var n = Math.floor((t - GRID.t0) / SPB);
    if (n === lastBeat) return;
    var jump = n - lastBeat;
    lastBeat = n;
    if (jump < 0 || jump > 8) return;
    beatNo = n;
    beatAt = GRID.t0 + n * SPB;
    beatHard = Math.min(1, energy(1, 22) * 1.7);

    var onPhrase = ((n - phraseRoot) % PHRASE + PHRASE) % PHRASE === 0;
    shake = Math.max(shake, beatHard * heat * (onPhrase ? 1 : 0.40));

    if (reduce) return;
    if (heat > 0.68 && onPhrase) blastAt = beatAt;
    if (heat > 0.85 && (onPhrase || beatHard > 0.82)) tearAt = beatAt;
    if (heat > 0.72 && onPhrase) chromaAt = beatAt;
    if (heat > 0.45) sparks((onPhrase ? 30 : 10) * heat);
  }

  /* ================= geometry ================= */
  var W = 0, H = 0, dpr = 1, cx = 0, cy = 0, FL = 0, M = 0;
  var ema = 0.016, slow = 0;

  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 1.25);
    var budget = 2.2e6;
    var px = window.innerWidth * window.innerHeight * dpr * dpr;
    if (px > budget) dpr *= Math.sqrt(budget / px);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2; cy = H / 2; M = Math.min(W, H);
    FL = M * 0.95;
    starLim2 = W * W + H * H;
    bands(); overKey = '';
  }
  window.addEventListener('resize', size);

  var RINGS = 22, SPACE = 300, ZNEAR = 55;
  var SPAN = RINGS * SPACE;
  var travel = 0, spin = 0, bendT = 0;

  var bx = 0, by = 0;
  function bendAt(z){
    var f = z / SPAN;
    f *= f;
    bx = Math.sin(z * 0.00040 + bendT) * M * 0.62 * f * P.bh;
    by = Math.cos(z * 0.00029 + bendT * 0.74) * M * 0.44 * f * P.bv;
  }

  function blast(n, t){
    var d = t - blastAt;
    if (d < 0 || d > 1.5) return 0;
    var g = n - d * 16;
    return Math.exp(-(g * g) / 7) * (1 - d / 1.5) * 0.60;
  }

  function ringR(n, t){
    return M * (P.rad + band(n) * 0.22 + blast(n, t)) *
           (1 + Math.sin(n * 0.7 + travel * 0.0014) * 0.06);
  }

  var ordZ = new Float32Array(64), ordN = new Int16Array(64), ordC = 0;
  function march(){
    ordC = 0;
    for (var n = 0; n < RINGS; n++){
      ordZ[ordC] = ((n * SPACE - travel) % SPAN + SPAN) % SPAN + ZNEAR;
      ordN[ordC] = n; ordC++;
    }
    for (var i = 1; i < ordC; i++){          /* insertion sort, far first */
      var z = ordZ[i], nn = ordN[i], j = i - 1;
      while (j >= 0 && ordZ[j] < z){ ordZ[j+1] = ordZ[j]; ordN[j+1] = ordN[j]; j--; }
      ordZ[j+1] = z; ordN[j+1] = nn;
    }
  }

  /* Two rolling buffers of projected points: the ring being drawn and the
     one behind it, so the wall between them can be filled without
     projecting anything twice. Marching far to near means consecutive
     entries are always one SPACE apart, and the near one paints over the
     far one, which is the whole depth cue. */
  var aX = new Float32Array(SEG + 1), aY = new Float32Array(SEG + 1);
  var bX = new Float32Array(SEG + 1), bY = new Float32Array(SEG + 1);

  function vortex(t, k, alpha, panelAmt, xoff, ribsOnly, near){
    march();
    var curX = aX, curY = aY, prvX = bX, prvY = bY, sw;
    var have = false, i, j;
    for (var oi = 0; oi < ordC; oi++){
      var z = ordZ[oi], n = ordN[oi];
      var depth = 1 - z / (SPAN + ZNEAR);
      if (depth < (near || 0.015)){ have = false; continue; }
      var r = ringR(n, t), s = FL / z, rs = r * s;
      bendAt(z);
      var ox = cx + bx + xoff, oy = cy + by;
      /* the twist is what makes it a vortex rather than a pipe: each ring
         is turned a little more than the one behind it */
      var rot = spin + n * 0.10 * P.twist;
      var ca = Math.cos(rot), sa = Math.sin(rot);
      for (i = 0; i <= SEG; i++){
        var qx = PX[i], qy = PY[i];
        curX[i] = ox + (qx * ca - qy * sa) * rs;
        curY[i] = oy + (qx * sa + qy * ca) * rs;
      }

      var lit = alpha * Math.pow(depth, 1.15);
      var bd = band(n);

      if (have && !ribsOnly && panelAmt > 0.02 && rs > M * 0.045){
        for (i = 0; i < SEG; i += 2){
          j = i + 2;
          /* lit from above: judged from where the facet sits on screen, so
             it stays right through any rotation, squash or morph */
          if ((curX[i] < 0 && curX[j] < 0 && prvX[i] < 0 && prvX[j] < 0) ||
              (curX[i] > W && curX[j] > W && prvX[i] > W && prvX[j] > W) ||
              (curY[i] < 0 && curY[j] < 0 && prvY[i] < 0 && prvY[j] < 0) ||
              (curY[i] > H && curY[j] > H && prvY[i] > H && prvY[j] > H)) continue;
          var my = (curY[i] + curY[j]) * 0.5 - oy;
          var face = clamp(0.5 - my / (2.2 * pyMax * rs), 0, 1);
          var shade = (0.14 + face * 0.36 + bd * 0.27) * lit * panelAmt;
          shade *= 0.46 + ALT[i + 1] * 0.54;
          if (shade < 0.010) continue;
          ctx.fillStyle = rgba(mix(mix(STEEL, k, 0.58), HOT, bd * 0.28), shade);
          ctx.beginPath();
          ctx.moveTo(curX[i], curY[i]);
          ctx.lineTo(curX[j], curY[j]);
          ctx.lineTo(prvX[j], prvY[j]);
          ctx.lineTo(prvX[i], prvY[i]);
          ctx.closePath();
          ctx.fill();
        }
      }

      if (rs > M * 0.030){
        ctx.globalAlpha = Math.min(1, lit * (0.58 + bd * 0.58));
        ctx.strokeStyle = rgba(mix(k, HOT, bd * 0.55), 1);
        ctx.lineWidth = 0.7 + depth * 6 + bd * 1.7;
        ctx.beginPath();
        ctx.moveTo(curX[0], curY[0]);
        for (i = 1; i <= SEG; i++) ctx.lineTo(curX[i], curY[i]);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      sw = prvX; prvX = curX; curX = sw;
      sw = prvY; prvY = curY; curY = sw;
      have = true;
    }
  }

  /* Lines running the length of it. On the round looks they are seams; on
     the flattened one they land on the floor and read as lane markings. */
  function rails(t, k, alpha){
    if (alpha < 0.02) return;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = rgba(mix(k, HOT, 0.40), 1);
    ctx.lineWidth = 1.8;
    march();
    for (var i = 0; i < SEG; i += 4){
      ctx.beginPath();
      var prevN = -99;
      for (var oi = 0; oi < ordC; oi++){
        var z = ordZ[oi], n = ordN[oi];
        if (z > SPAN * 0.7){ prevN = -99; continue; }
        var r = ringR(n, t), s = FL / z, rs = r * s;
        bendAt(z);
        var rot = spin + n * 0.10 * P.twist;
        var ca = Math.cos(rot), sa = Math.sin(rot);
        var px = cx + bx + (PX[i] * ca - PY[i] * sa) * rs;
        var py = cy + by + (PX[i] * sa + PY[i] * ca) * rs;
        if (n === prevN - 1) ctx.lineTo(px, py); else ctx.moveTo(px, py);
        prevN = n;
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  /* the light at the end of it */
  function eye(k, power, bass){
    var r = M * (0.05 + bass * 0.10 + power * 0.16);
    bendAt(ZNEAR + SPAN * 0.96);
    var ex = cx + bx * 0.5, ey = cy + by * 0.5;
    ctx.globalCompositeOperation = 'lighter';
    var g = ctx.createRadialGradient(ex, ey, 0, ex, ey, r * 3.4);
    g.addColorStop(0,    rgba(mix(k, HOT, 0.75), 0.62));
    g.addColorStop(0.22, rgba(k, 0.30));
    g.addColorStop(1,    rgba(k, 0));
    ctx.fillStyle = g;
    ctx.fillRect(ex - r * 3.4, ey - r * 3.4, r * 6.8, r * 6.8);
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---- sparks: debris coming off it, with depth so they streak ---- */
  var SP = [];
  function sparks(n){
    for (var i = 0; i < n && SP.length < 240; i++){
      SP.push({ a: Math.random() * TAU, r: M * (0.22 + Math.random() * 0.24),
                z: SPAN * (0.30 + Math.random() * 0.65),
                v: 1 + Math.random() * 2.4, spr: 0.3 + Math.random() * 1.7,
                life: 1, decay: 0.5 + Math.random() * 0.85 });
    }
  }
  function drawSparks(dt, k, speed){
    if (!SP.length) return;
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = rgba(mix(k, HOT, 0.6), 1);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (var i = SP.length - 1; i >= 0; i--){
      var p = SP[i];
      p.z -= speed * p.v * dt;
      p.r += M * 0.05 * p.spr * dt;
      p.life -= p.decay * dt;
      if (p.z < 45 || p.life <= 0 ||
          p.r * FL / p.z > M * 2.2){ SP.splice(i, 1); continue; }
      var s1 = FL / p.z, s2 = FL / (p.z + speed * p.v * 0.05);
      var c = Math.cos(p.a), sn = Math.sin(p.a);
      bendAt(p.z);
      ctx.moveTo(cx + bx + c * p.r * s1, cy + by + sn * p.r * s1);
      ctx.lineTo(cx + bx + c * p.r * s2, cy + by + sn * p.r * s2);
    }
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---- stars for the empty stretches ---- */
  var STARS = 200, stx = null, sty = null, stz = null, starLim2 = 1e9;
  function stars(k, alpha, streak){
    if (alpha < 0.02) return;
    if (!stx){
      stx = new Float32Array(STARS); sty = new Float32Array(STARS);
      stz = new Float32Array(STARS);
      for (var i = 0; i < STARS; i++){
        stx[i] = (Math.random() - 0.5) * M * 4;
        sty[i] = (Math.random() - 0.5) * M * 4;
        stz[i] = 60 + Math.random() * SPAN;
      }
    }
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = rgba(k, 1);
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    for (var j = 0; j < STARS; j++){
      var z = stz[j];
      if (z < 60){ stz[j] = SPAN; z = SPAN; }
      var s = FL / z, ax = stx[j] * s, ay = sty[j] * s;
      if (ax * ax + ay * ay > starLim2){ stz[j] = SPAN; continue; }
      var s2 = FL / (z + streak);
      ctx.moveTo(cx + ax, cy + ay);
      ctx.lineTo(cx + stx[j] * s2, cy + sty[j] * s2);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  function starMarch(d){ if (stz) for (var i = 0; i < STARS; i++) stz[i] -= d; }

  /* ---- the rev counter. the track is named after it. ---- */
  function gauge(bass){
    var r = M * 0.142, gx = W - r - 38, gy = H - r - 74;
    if (W < 820){ r = M * 0.112; gx = W - r - 18; gy = H - r - 84; }
    var a0 = Math.PI * 0.74, a1 = Math.PI * 2.26;
    var v = clamp(rev, 0, 1.12), hot = v > 0.78;
    var kk = hot ? mix(AMBER, RED, clamp((v - 0.78) / 0.3, 0, 1)) : col;

    ctx.globalAlpha = 0.34;
    ctx.strokeStyle = rgba(STEEL, 1);
    ctx.lineWidth = 13;
    ctx.beginPath(); ctx.arc(gx, gy, r, a0, a1); ctx.stroke();

    ctx.globalAlpha = hot ? 0.92 : 0.38;
    ctx.strokeStyle = rgba(RED, 1);
    ctx.beginPath(); ctx.arc(gx, gy, r, a0 + (a1 - a0) * 0.78, a1); ctx.stroke();

    ctx.globalAlpha = 1;
    ctx.strokeStyle = rgba(kk, 1);
    ctx.beginPath(); ctx.arc(gx, gy, r, a0, a0 + (a1 - a0) * Math.min(1, v));
    ctx.stroke();

    if (hot){
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = clamp((v - 0.78) / 0.3, 0, 1) * (0.14 + bass * 0.26);
      var fg = ctx.createRadialGradient(gx, gy, r * 0.55, gx, gy, r * 1.35);
      fg.addColorStop(0, rgba(RED, 0.5));
      fg.addColorStop(1, rgba(RED, 0));
      ctx.fillStyle = fg;
      ctx.fillRect(gx - r * 1.4, gy - r * 1.4, r * 2.8, r * 2.8);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }

    var na = a0 + (a1 - a0) * Math.min(1, v);
    ctx.strokeStyle = rgba(HOT, 1);
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(gx - Math.cos(na) * r * 0.2, gy - Math.sin(na) * r * 0.2);
    ctx.lineTo(gx + Math.cos(na) * r * 0.84, gy + Math.sin(na) * r * 0.84);
    ctx.stroke();
    ctx.fillStyle = rgba(HOT, 1);
    ctx.beginPath(); ctx.arc(gx, gy, 5, 0, TAU); ctx.fill();

    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 2;
    for (var i = 0; i <= 8; i++){
      var ta = a0 + (a1 - a0) * (i / 8);
      ctx.strokeStyle = rgba(i >= 6 ? RED : STEEL, 1);
      ctx.beginPath();
      ctx.moveTo(gx + Math.cos(ta) * r * 1.16, gy + Math.sin(ta) * r * 1.16);
      ctx.lineTo(gx + Math.cos(ta) * r * (i >= 6 ? 1.34 : 1.27),
                 gy + Math.sin(ta) * r * (i >= 6 ? 1.34 : 1.27));
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function tear(power){
    var n = 2 + (power * 3) | 0;
    for (var i = 0; i < n; i++){
      var y = Math.random() * H, h = 4 + Math.random() * 58;
      var d = (Math.random() - 0.5) * 200 * power;
      ctx.drawImage(canvas, 0, y * dpr, canvas.width, h * dpr, d, y, W, h);
    }
  }

  var over = null, overKey = '', linePat = null;
  function overlay(){
    var q = Math.round(heat * 6);
    var k2 = W + 'x' + H + '|' + q + '|' + Math.round(dpr * 100);
    if (overKey !== k2){
      overKey = k2;
      if (!over) over = document.createElement('canvas');
      over.width = canvas.width; over.height = canvas.height;
      var g = over.getContext('2d');
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, W, H);
      var vg = g.createRadialGradient(cx, cy, M * 0.30, cx, cy, M * 1.0);
      vg.addColorStop(0, 'rgba(0,0,0,0)');
      vg.addColorStop(1, 'rgba(0,0,0,' + (0.44 + (q / 6) * 0.30).toFixed(3) + ')');
      g.fillStyle = vg; g.fillRect(0, 0, W, H);
      if (!reduce){
        if (!linePat){
          var c = document.createElement('canvas');
          c.width = 1; c.height = 3;
          var gc = c.getContext('2d');
          gc.fillStyle = 'rgba(0,0,0,0.34)';
          gc.fillRect(0, 0, 1, 1);
          linePat = c;
        }
        g.globalAlpha = 0.5;
        g.fillStyle = g.createPattern(linePat, 'repeat');
        g.fillRect(0, 0, W, H);
        g.globalAlpha = 1;
      }
    }
    ctx.drawImage(over, 0, 0, W, H);
  }

  /* ================= the loop ================= */
  var last = 0, now8 = 0, roll = 0;

  function frame(ms){
    requestAnimationFrame(frame);
    now8 = ms / 1000;
    var dt = last ? Math.min(now8 - last, 0.05) : 0.016;
    last = now8;
    ema = ema * 0.94 + dt * 0.06;
    slow = ema > 0.034 ? Math.min(1, slow + dt * 0.5) : Math.max(0, slow - dt * 0.25);

    var t = audio.currentTime;
    state(t, dt);
    readBands();
    beats(t);

    var bass = energy(1, 14);
    var since = t - beatAt;
    var pulse = since >= 0 && since < SPB * 0.9
      ? Math.pow(1 - since / (SPB * 0.9), 2.2) * beatHard : 0;
    var k = col;

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = rgba(INK, 0.52 + (1 - heat) * 0.34);
    ctx.fillRect(0, 0, W, H);

    /* Speed comes from the crossfade, so it is already climbing while the
       bar before a drop is still playing, and the surge on the mark is the
       kick on top of it. The bass moves it too, which is the part you feel
       rather than see. */
    var speed = 1750 * P.spd * (1 + bass * 0.75) *
                (1 + surge * 1.25) * (1 + trans * 0.55 * transDir);
    travel += dt * speed;
    starMarch(dt * speed * 1.15);
    spin += dt * (0.05 + heat * 0.24 + P.twist * 0.06 +
                  trans * 0.70 * (1 - P.flat)) * (1 - P.flat * 0.96);
    if (P.flat > 0.02){
      var sw = ((spin % TAU) + TAU) % TAU;
      if (sw > Math.PI) sw -= TAU;
      spin -= sw * Math.min(1, dt * 2.2 * P.flat);
    }
    bendT += dt * (0.16 + heat * 0.34);
    roll += dt * (heat > 0.85 ? 0.22 : 0.05) * Math.sin(now8 * 0.31);

    shake *= Math.pow(0.0018, dt);
    var amp = M * 0.026 * shake;

    ctx.save();
    ctx.translate(cx + (Math.random() - 0.5) * amp, cy + (Math.random() - 0.5) * amp);
    ctx.rotate(roll * (1 - P.flat * 0.86) + (Math.random() - 0.5) * 0.014 * shake);
    var punch = 1 + pulse * (0.008 + heat * 0.032) + surge * 0.03;
    ctx.scale(punch, punch);
    ctx.translate(-cx, -cy);

    stars(mix(STEEL, k, 0.7), P.star * 0.7, speed * 0.055);

    /* the kaleidoscope is the same vortex seen in a folded mirror, and it
       fades in and out rather than being switched on */
    if (P.foldA > 0.02 && !reduce){
      var folds = slow > 0.5 ? 3 : 4;
      for (var fo = 1; fo < folds; fo++){
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate((fo / folds) * TAU);
        if (fo % 2) ctx.scale(1, -1);
        ctx.translate(-cx, -cy);
        vortex(t, fo % 2 ? mix(k, HOT, 0.3) : k,
               P.alphaMul * P.foldA * (fo === 1 ? 0.40 : 0.28),
               0, 0, true, 0.42);
        ctx.restore();
      }
    }

    vortex(t, k, P.alphaMul, P.panel, 0, false);
    rails(t, k, P.rail);
    eye(k, pulse * (0.3 + heat * 0.35) + trans * 0.55, bass);

    if (chroma > 0.05 && !reduce){
      var ab = (1.5 + pulse * 6 + heat * 2.5) * chroma;
      var ch = [[[255, 24, 24], -ab], [[70, 110, 255], ab]];
      ctx.globalCompositeOperation = 'lighter';
      for (var ci = 0; ci < 2; ci++){
        vortex(t, ch[ci][0], 0.26 * chroma, 0, ch[ci][1], true, 0.48);
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    if (P.spd > 0.1) drawSparks(dt, k, speed);

    /* the spectrum, for the stretches with nothing else in them */
    if (P.arc > 0.03){
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = P.arc * 0.5;
      ctx.strokeStyle = rgba(k, 1);
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      for (var q2 = 0; q2 <= N; q2++){
        ctx.lineTo((q2 / N) * W, cy + M * 0.34 - level[q2 % N] * M * 0.17);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    var bdd = t - blastAt;
    if (bdd >= 0 && bdd < 1.1){
      var bp = bdd / 1.1;
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = (1 - bp) * (1 - bp) * 0.30;
      ctx.strokeStyle = rgba(mix(k, HOT, 0.5), 1);
      ctx.lineWidth = 2 + (1 - bp) * 9;
      ctx.beginPath();
      ctx.arc(cx, cy, M * (0.10 + bp * 1.0), 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    ctx.restore();

    if (!reduce){
      var td = t - tearAt;
      if (td >= 0 && td < 0.14) tear(0.5 + heat * 0.6);
      var cd = t - chromaAt;
      if (cd >= 0 && cd < 0.07){
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.2;
        ctx.drawImage(canvas, 8, 0, W, H);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
      }
    }

    /* the surge reads as the tunnel being pulled at, not as a flash */
    if (surge > 0.01){
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = surge * 0.09;
      ctx.fillStyle = rgba(HOT, 1);
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    if (slow < 0.6) overlay();
    gauge(bass);
    hud(t);
  }

  /* ================= hud ================= */
  var lastShown = -1;
  function hud(t){
    var p = clamp(t / T.dur, 0, 1);
    fill.style.width = (p * 100) + '%';
    head.style.left = (p * 100) + '%';
    var s = t | 0;
    if (s !== lastShown){
      lastShown = s;
      clock.textContent = (s / 60 | 0) + ':' + ('0' + (s % 60)).slice(-2);
      bar.setAttribute('aria-valuenow', String(s));
    }
  }

  function jumped(){
    lastBeat = -1e9; beatAt = -9; beatHard = 0;
    tearAt = chromaAt = blastAt = surgeAt = -9;
    travel = 0; stz = null; stx = null; sty = null; SP.length = 0;
    shake = 0; lastIdx = -1;
  }

  bar.addEventListener('click', function(e){
    var r = bar.getBoundingClientRect();
    audio.currentTime = clamp(((e.clientX - r.left) / r.width) * T.dur, 0, T.dur - 0.05);
    jumped();
  });
  bar.addEventListener('keydown', function(e){
    var d = e.key === 'ArrowRight' ? 5 : e.key === 'ArrowLeft' ? -5 : 0;
    if (!d) return;
    e.preventDefault();
    audio.currentTime = clamp(audio.currentTime + d, 0, T.dur - 0.05);
    jumped();
  });

  function toggle(){
    if (audio.paused){
      if (actx && actx.state === 'suspended') actx.resume();
      audio.play();
    } else audio.pause();
  }
  pp.addEventListener('click', toggle);
  audio.addEventListener('play',  function(){ document.body.classList.add('going'); });
  audio.addEventListener('pause', function(){ document.body.classList.remove('going'); });
  document.addEventListener('keydown', function(e){
    if (e.code === 'Space' && e.target === document.body){ e.preventDefault(); toggle(); }
  });

  var idleTimer;
  function stir(){
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){ document.body.classList.add('idle'); }, 2800);
  }
  document.addEventListener('mousemove', stir);
  document.addEventListener('touchstart', stir);

  document.getElementById('start').addEventListener('click', function(){
    listen();
    if (actx && actx.state === 'suspended') actx.resume();
    audio.play();
    gate.classList.add('gone');
    setTimeout(function(){ gate.style.display = 'none'; }, 900);
    stir();
  });

  window.__od = {
    T: T, grid: GRID,
    at: function(t){
      state(t, 0);
      return { scene: sceneName, heat: +heat.toFixed(3), rev: +rev.toFixed(3),
               spd: +P.spd.toFixed(3), panel: +P.panel.toFixed(3),
               hue: +P.hue.toFixed(3), surge: +surge.toFixed(3),
               trans: +trans.toFixed(3), dir: transDir,
               flat: +P.flat.toFixed(3),
               shake: +shake.toFixed(3), sparks: SP.length };
    }
  };

  size();
  requestAnimationFrame(frame);

  try { if (window.top !== window.self) document.querySelector('.backlink').remove(); }
  catch(e){}
})();
</script>
</body>
</html>
