<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Four minutes and twenty seconds at two hundred and ten beats a minute. Do not stand too close.">
<meta name="theme-color" content="#03040A">

<title>OVERDRIVE</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/favicon.svg">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --ink:#03040A;
    --cyan:#38E8FF;
    --amber:#FFB020;
    --red:#FF2D2D;
    --hot:#FFF4E0;
    --dim:#4A5A6E;
    --edge:#141C28;
    --mono:"JetBrains Mono",Consolas,ui-monospace,monospace;
    --disp:"Bebas Neue","Arial Narrow",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;overflow:hidden;background:#000;
    color:var(--dim);font-family:var(--mono);
    -webkit-font-smoothing:antialiased;
  }
  #viz{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

  .hud{
    position:fixed;left:0;right:0;bottom:0;z-index:3;
    display:flex;align-items:center;gap:12px;
    padding:12px clamp(12px,3vw,22px) 14px;
    font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    background:linear-gradient(180deg, rgba(3,4,10,0), rgba(3,4,10,.9) 46%);
    transition:opacity .5s ease;
  }
  body.idle .hud{opacity:.1}
  .hud:hover{opacity:1 !important}
  .pp{
    flex:0 0 auto;width:30px;height:30px;padding:0;cursor:pointer;
    background:transparent;border:1px solid var(--edge);border-radius:2px;
    color:var(--cyan);
    display:flex;align-items:center;justify-content:center;
    transition:border-color .4s ease, color .8s ease, background .25s ease;
  }
  .pp:hover{background:rgba(255,255,255,.06);border-color:var(--cyan)}
  .pp b{display:block;width:0;height:0;
        border-left:9px solid currentColor;border-top:6px solid transparent;
        border-bottom:6px solid transparent;margin-left:2px}
  body.going .pp b{
    width:9px;height:11px;border:0;margin:0;background:currentColor;
    box-shadow:inset 3px 0 0 rgba(0,0,0,.85);
  }

  .bar{position:relative;flex:1 1 auto;height:22px;cursor:pointer;
       display:flex;align-items:center}
  .bar-track{position:relative;width:100%;height:4px;
             background:rgba(255,255,255,.07);overflow:hidden}
  .seg{position:absolute;top:0;bottom:0}
  .bar-fill{position:absolute;left:0;top:0;bottom:0;width:0;
            background:var(--hot);box-shadow:0 0 12px rgba(255,244,224,.8)}
  .bar-head{position:absolute;top:50%;width:2px;height:15px;margin-top:-7.5px;
            background:#FFF;opacity:.85;pointer-events:none}
  .t{flex:0 0 auto;font-variant-numeric:tabular-nums;letter-spacing:.1em}

  .backlink{
    position:fixed;top:14px;left:14px;z-index:4;
    font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim);text-decoration:none;
    padding:7px 11px 8px;border:1px solid var(--edge);border-radius:2px;
    background:rgba(3,4,10,.72);
    transition:color .25s ease, border-color .4s ease, opacity .5s ease;
  }
  .backlink:hover{color:#FFF;border-color:var(--cyan)}
  body.idle .backlink{opacity:.1}
  .backlink:hover{opacity:1}

  .credit{
    position:fixed;top:14px;right:16px;z-index:4;text-align:right;
    pointer-events:none;transition:opacity .5s ease;
  }
  .credit b{
    display:block;font-family:var(--disp);font-size:26px;line-height:.9;
    letter-spacing:.06em;color:#EAF6FF;
    text-shadow:0 2px 16px rgba(0,0,0,.95), 0 0 3px rgba(0,0,0,.8);
  }
  .credit span{
    display:block;font-size:9px;font-weight:700;letter-spacing:.24em;
    text-transform:uppercase;color:#9FB4C8;margin-top:3px;
    text-shadow:0 1px 10px rgba(0,0,0,.95);
  }
  body.idle .credit{opacity:.16}

  .gate{
    position:fixed;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;padding:24px;text-align:center;
    background:radial-gradient(70% 55% at 50% 46%, #0A1020, #000 78%);
    transition:opacity .8s ease;
  }
  .gate.gone{opacity:0;pointer-events:none}
  .gate h1{
    margin:0;font-family:var(--disp);
    font-size:clamp(62px,17vw,220px);line-height:.84;letter-spacing:.02em;
    color:#EAF6FF;
    text-shadow:0 0 40px rgba(56,232,255,.5), 0 0 120px rgba(56,232,255,.22);
    animation:rev 3.4s ease-in-out infinite;
  }
  @keyframes rev{
    0%,100%{text-shadow:0 0 40px rgba(56,232,255,.5), 0 0 120px rgba(56,232,255,.22)}
    50%    {text-shadow:0 0 46px rgba(255,45,45,.55), 0 0 140px rgba(255,176,32,.28)}
  }
  .gate .warn{
    margin:0;font-size:10px;font-weight:700;letter-spacing:.3em;
    text-transform:uppercase;color:var(--red);
  }
  .gate .meta{
    margin:0;font-size:10px;font-weight:700;letter-spacing:.24em;
    text-transform:uppercase;color:#3A4658;
  }
  .gate button{
    margin-top:8px;cursor:pointer;font-family:var(--mono);
    font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;
    color:#03040A;background:var(--cyan);
    border:1px solid #9BF3FF;border-radius:2px;padding:15px 34px 16px;
    transition:background .2s ease, transform .1s ease;
  }
  .gate button:hover{background:#7BEEFF}
  .gate button:active{transform:translateY(2px)}
  .gate button:focus-visible{outline:2px solid var(--red);outline-offset:4px}

  @media (max-width:620px){ .credit b{font-size:18px} }
</style>

<body>

<canvas id="viz" aria-hidden="true"></canvas>

<a class="backlink" href="/">&larr; shaiyex.com</a>
<p class="credit"><b>OVERDRIVE</b><span>210 bpm</span></p>

<div class="hud" id="hud">
  <button class="pp" id="pp" type="button" aria-label="Play or pause"><b></b></button>
  <div class="bar" id="bar" role="slider" tabindex="0"
       aria-label="Position" aria-valuemin="0" aria-valuemax="260" aria-valuenow="0">
    <div class="bar-track" id="bartrack">
      <i class="bar-fill" id="fill"></i>
    </div>
    <i class="bar-head" id="head"></i>
  </div>
  <span class="t" id="clock">0:00</span>
</div>

<div class="gate" id="gate">
  <p class="warn">Redline</p>
  <h1>OVERDRIVE</h1>
  <p class="meta">4:20 &middot; 210 bpm &middot; headphones, and not quietly</p>
  <button id="start" type="button">Send it</button>
</div>

<audio id="track" src="track.mp3" preload="auto"></audio>

<script>
(function(){
  "use strict";

  /* ====================================================================
     OVERDRIVE

     210.0000 bpm exactly. Measured by fitting a comb over the onset
     envelope: at 210 the beat phase that the four loud sections
     independently land on agrees to within 19 ms across 244 seconds, and
     at 209.96 it is 44 ms, which is how you know it is a round number and
     not a near one. First beat at 0.2695 s. The phrase is 8 beats, not 4:
     the low band's 8 beat periodicity scores 35.8 against 1.9 for 4.

     Every mark below is a beat of that grid. The two drops are beats 399
     and 585.

     The shaft is drawn as solid shaded panels rather than a wireframe,
     far ribs first so the near ones cover them, and it bends as it goes
     so you are flying down a road instead of sitting inside an onion.
     ==================================================================== */
  var GRID = { bpm: 210, t0: 0.2695 };
  var SPB  = 60 / GRID.bpm;
  var PHRASE = 8;

  var T = {
    caught: 12.555,   /* beat  43  the engine catches, low band 0.09 -> 0.66 */
    turn:   47.984,   /* beat 167  after a one second hole */
    subIn:  71.984,   /* beat 251  the centroid falls to 771. all sub, no top */
    subOut: 79.984,   /* beat 279  and back up */
    brk:    87.984,   /* beat 307  thin and bright */
    drop1: 114.269,   /* beat 399  DROP ONE. loudest low band in the track */
    out1:  131.984,   /* beat 461 */
    hollow:151.984,   /* beat 531  the emptiest point, low band 0.03 */
    drop2: 167.412,   /* beat 585  DROP TWO, and it is bigger */
    dip:   191.984,   /* beat 671  one bar of air inside it */
    out2:  204.555,   /* beat 715 */
    last:  233.698,   /* beat 817  the final push */
    finish:256.555,   /* beat 897  the body ends */
    dead:  259.000,
    dur:   260.306
  };

  var ARC = [
    [0,        'void',    0.12],
    [T.caught, 'shaft',   0.52],
    [T.turn,   'corridor',0.60],
    [T.subIn,  'sub',     0.80],
    [T.subOut, 'shaft',   0.56],
    [T.brk,    'void',    0.26],
    [T.drop1,  'redline', 1.00],
    [T.out1,   'core',    0.34],
    [T.hollow, 'void',    0.10],
    [T.drop2,  'kaleido', 1.00],
    [T.dip,    'redline', 0.92],
    [T.out2,   'corridor',0.44],
    [T.last,   'redline', 0.96],
    [T.finish, 'core',    0.30],
    [T.dead,   'dead',    0.00]
  ];

  var SCENE_TINT = {
    void:'#1C3A52', shaft:'#38E8FF', corridor:'#5AA8FF', sub:'#FF2D2D',
    redline:'#FFB020', core:'#8FE8FF', kaleido:'#FF5CE0', dead:'#101820'
  };

  var audio  = document.getElementById('track');
  var canvas = document.getElementById('viz');
  var gate   = document.getElementById('gate');
  var pp     = document.getElementById('pp');
  var bar    = document.getElementById('bar');
  var fill   = document.getElementById('fill');
  var head   = document.getElementById('head');
  var clock  = document.getElementById('clock');
  var ctx    = canvas.getContext('2d', { alpha: false });

  var reduce = window.matchMedia &&
               window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var TAU = Math.PI * 2;

  (function segments(){
    var tr = document.getElementById('bartrack');
    for (var i = 0; i < ARC.length; i++){
      var a = ARC[i][0], b = i + 1 < ARC.length ? ARC[i + 1][0] : T.dur;
      var s = document.createElement('i');
      s.className = 'seg';
      s.style.left = (a / T.dur * 100) + '%';
      s.style.width = ((b - a) / T.dur * 100) + '%';
      s.style.background = SCENE_TINT[ARC[i][1]];
      s.style.opacity = 0.18 + ARC[i][2] * 0.55;
      tr.insertBefore(s, fill);
    }
  })();

  /* ================= audio ================= */
  var actx, analyser, freq;

  function listen(){
    if (actx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    analyser = actx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.58;
    freq = new Uint8Array(analyser.frequencyBinCount);
    actx.createMediaElementSource(audio).connect(analyser);
    analyser.connect(actx.destination);
    bands();
  }

  var N = 0, edges = [], level;

  function bands(){
    N = window.innerWidth < 620 ? 26 : 40;
    level = new Float32Array(N);
    edges = [];
    if (!analyser) return;
    var lo = 2, hi = Math.min(analyser.frequencyBinCount - 1, 460);
    for (var i = 0; i <= N; i++) edges.push(Math.round(lo * Math.pow(hi / lo, i / N)));
  }

  function readBands(){
    if (!analyser || !edges.length) return;
    analyser.getByteFrequencyData(freq);
    for (var i = 0; i < N; i++){
      var a = edges[i], b = Math.max(edges[i + 1], a + 1), m = 0;
      for (var j = a; j < b; j++) if (freq[j] > m) m = freq[j];
      var v = (m / 255) * (0.62 + 0.55 * (i / N));
      level[i] += (Math.pow(v > 1 ? 1 : v, 1.2) - level[i]) * 0.40;
    }
  }

  function band(n){ return level[((n * 2) % N + N) % N]; }

  function energy(a, b){
    if (!analyser) return 0;
    var s = 0;
    for (var i = a; i < b; i++) s += freq[i];
    return (s / (b - a)) / 255;
  }

  /* ================= the clock ================= */
  var lastBeat = -1e9, beatAt = -9, beatHard = 0, beatNo = 0;
  var tearAt = -9, chromaAt = -9, blastAt = -9, shake = 0;

  function beats(t){
    var n = Math.floor((t - GRID.t0) / SPB);
    if (n === lastBeat) return;
    var jump = n - lastBeat;
    lastBeat = n;
    if (jump < 0 || jump > 8) return;
    beatNo = n;
    beatAt = GRID.t0 + n * SPB;
    beatHard = Math.min(1, energy(1, 22) * 1.7);

    var onPhrase = ((n - phraseRoot) % PHRASE + PHRASE) % PHRASE === 0;

    /* The room moves on every beat and it moves properly at the top of the
       rev range. Offset and rotation only, so it reads as force without
       spending anything against the flash budget. */
    shake = Math.max(shake, beatHard * heat * (onPhrase ? 1 : 0.40));

    if (reduce) return;
    if (heat > 0.68 && onPhrase) blastAt = beatAt;
    if (heat > 0.85 && (onPhrase || beatHard > 0.82)) tearAt = beatAt;
    if (heat > 0.72 && onPhrase) chromaAt = beatAt;
    if (heat > 0.45) sparks((onPhrase ? 30 : 10) * heat);
  }

  /* ================= state ================= */
  function clamp(x, a, b){ return x < a ? a : x > b ? b : x; }

  var scene = 'void', sceneAt = -9, phraseRoot = 0;
  var heat = 0, heatT = 0, rev = 0;

  function state(t, dt){
    var i, k = 0;
    for (i = 0; i < ARC.length; i++) if (t >= ARC[i][0]) k = i;
    var want = ARC[k][1];
    heatT = ARC[k][2];
    if (want !== scene){
      scene = want; sceneAt = t;
      phraseRoot = Math.round((ARC[k][0] - GRID.t0) / SPB);
    }
    heat += (heatT - heat) * (dt ? clamp(dt * 3.2, 0, 1) : 1);
    var target = heat * 0.72 + energy(1, 22) * 0.44;
    rev += (target - rev) * (dt ? clamp(dt * (target > rev ? 9 : 1.5), 0, 1) : 1);
  }

  /* ================= colour ================= */
  function mix(a, b, t){
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  }
  function rgba(c, a){
    return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')';
  }
  var CYAN = [56, 232, 255], AMBER = [255, 176, 32], RED = [255, 45, 45];
  var VIOLET = [150, 90, 255];
  var HOT = [255, 244, 224], PINK = [255, 92, 224], STEEL = [26, 44, 66];
  var INK = [3, 4, 10];

  /* One axis: how hard it is being pushed. Cold cyan up to hot metal, by
     way of violet, because cyan lerped straight at amber goes through grey
     and the middle of the track came out the colour of pond water. */
  function ramp(x){
    x = clamp(x, 0, 1);
    return x < 0.5 ? mix(CYAN, VIOLET, x * 2) : mix(VIOLET, AMBER, (x - 0.5) * 2);
  }
  function key(){
    var c = scene === 'sub' ? RED
          : scene === 'kaleido' ? PINK
          : ramp((heat - 0.35) / 0.45);
    return mix(c, RED, clamp((heat - 0.82) / 0.18, 0, 1) * 0.55);
  }

  /* ================= geometry ================= */
  var W = 0, H = 0, dpr = 1, cx = 0, cy = 0, FL = 0, M = 0;
  var ema = 0.016, slow = 0;

  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 1.25);
    var budget = 2.2e6;
    var px = window.innerWidth * window.innerHeight * dpr * dpr;
    if (px > budget) dpr *= Math.sqrt(budget / px);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2; cy = H / 2; M = Math.min(W, H);
    FL = M * 0.95;
    bands(); overKey = '';
  }
  window.addEventListener('resize', size);

  var RINGS = 24, SPACE = 300, ZNEAR = 55;
  var SPAN = RINGS * SPACE;
  var travel = 0, spin = 0, bendT = 0;

  /* The shaft is not straight. Offset is a function of a ring's real z, so
     as a ring comes at you its offset falls to zero on its own and the
     whole thing reads as a road with bends in it rather than an onion. */
  var bx = 0, by = 0, bendH = 1, bendV = 1;
  function bendAt(z){
    var f = z / SPAN;
    f *= f;
    bx = Math.sin(z * 0.00040 + bendT) * M * 0.62 * f * bendH;
    by = Math.cos(z * 0.00029 + bendT * 0.74) * M * 0.44 * f * bendV;
  }

  /* A pressure wave that runs away down the shaft when a phrase lands, so
     the walls blow out in a ring you can watch travel into the distance. */
  function blast(n, t){
    var d = t - blastAt;
    if (d < 0 || d > 1.5) return 0;
    var g = n - d * 16;
    return Math.exp(-(g * g) / 7) * (1 - d / 1.5) * 0.60;
  }

  function ringR(n, t){
    return M * (0.30 + band(n) * 0.22 + blast(n, t)) *
           (1 + Math.sin(n * 0.7 + travel * 0.0014) * 0.06);
  }

  /* ord* is preallocated: this runs up to five times a frame and the
     garbage from rebuilding an array of pairs showed up in the frame times. */
  var ordZ = new Float32Array(64), ordN = new Int16Array(64), ordC = 0;
  function march(){
    ordC = 0;
    for (var n = 0; n < RINGS; n++){
      ordZ[ordC] = ((n * SPACE - travel) % SPAN + SPAN) % SPAN + ZNEAR;
      ordN[ordC] = n; ordC++;
    }
    for (var i = 1; i < ordC; i++){          /* insertion sort, far first */
      var z = ordZ[i], nn = ordN[i], j = i - 1;
      while (j >= 0 && ordZ[j] < z){ ordZ[j+1] = ordZ[j]; ordN[j+1] = ordN[j]; j--; }
      ordZ[j+1] = z; ordN[j+1] = nn;
    }
  }

  /* ---- the shaft ---- */
  function shaft(sides, t, k, alpha, panels){
    var i, n, z, zz, r, rr, s, ss, a, aa, ox, oy, oxx, oyy;
    march();
    for (var oi = 0; oi < ordC; oi++){
      z = ordZ[oi]; n = ordN[oi];
      var depth = 1 - z / (SPAN + ZNEAR);
      if (depth < 0.015) continue;
      r = ringR(n, t);
      s = FL / z;
      bendAt(z); ox = cx + bx; oy = cy + by;

      var lit = alpha * Math.pow(depth, 1.15);
      var bd = band(n);

      /* The wall between this rib and the one just in front of it, filled.
         A line has no weight and this track is nothing but weight. */
      if (panels){
        zz = z - SPACE;
        if (zz > ZNEAR){
          rr = ringR((n - 1 + RINGS) % RINGS, t);
          ss = FL / zz;
          bendAt(zz); oxx = cx + bx; oyy = cy + by;
          for (i = 0; i < sides; i++){
            a  = spin + (i / sides) * TAU + n * 0.10;
            aa = spin + ((i + 1) / sides) * TAU + n * 0.10;
            /* a light from above, so the shaft has a roof and a floor */
            var face = 0.5 - Math.cos(a + TAU / (sides * 2)) * 0.5;
            var shade = (0.14 + face * 0.36 + bd * 0.27) * lit;
            if (i % 2) shade *= 0.52;
            if (shade < 0.010) continue;
            ctx.fillStyle = rgba(mix(mix(STEEL, k, 0.58), HOT, bd * 0.28), shade);
            ctx.beginPath();
            ctx.moveTo(ox  + Math.cos(a)  * r  * s,  oy  + Math.sin(a)  * r  * s);
            ctx.lineTo(ox  + Math.cos(aa) * r  * s,  oy  + Math.sin(aa) * r  * s);
            ctx.lineTo(oxx + Math.cos(aa) * rr * ss, oyy + Math.sin(aa) * rr * ss);
            ctx.lineTo(oxx + Math.cos(a)  * rr * ss, oyy + Math.sin(a)  * rr * ss);
            ctx.closePath();
            ctx.fill();
          }
        }
      }

      /* the rib itself: bright, and thick when it is close */
      if (r * s < M * 0.030) continue;
      ctx.globalAlpha = Math.min(1, lit * (0.58 + bd * 0.58));
      ctx.strokeStyle = rgba(mix(k, HOT, bd * 0.55), 1);
      ctx.lineWidth = 0.7 + depth * 6 + bd * 1.7;
      ctx.beginPath();
      for (i = 0; i <= sides; i++){
        a = spin + (i / sides) * TAU + n * 0.10;
        var px = ox + Math.cos(a) * r * s, py = oy + Math.sin(a) * r * s;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  /* ---- rails running the length of it, which is what sells the speed ---- */
  function rails(sides, t, k, alpha){
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = rgba(mix(k, HOT, 0.40), 1);
    ctx.lineWidth = 1.8;
    for (var i = 0; i < sides; i += 2){
      ctx.beginPath();
      var first = true;
      for (var n = 0; n < RINGS; n++){
        var z = ((n * SPACE - travel) % SPAN + SPAN) % SPAN + ZNEAR;
        if (z > SPAN * 0.7) continue;
        var r = ringR(n, t), s = FL / z;
        bendAt(z);
        var a = spin + (i / sides) * TAU + n * 0.10;
        var px = cx + bx + Math.cos(a) * r * s, py = cy + by + Math.sin(a) * r * s;
        if (first){ ctx.moveTo(px, py); first = false; } else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  /* ---- a flat corridor: floor and ceiling in solid slabs ---- */
  function corridor(t, k, alpha, bass){
    var lift = M * (0.34 + bass * 0.12);
    march();
    for (var oi = 0; oi < ordC; oi++){
      var z1 = ordZ[oi], nn = ordN[oi], z2 = z1 - SPACE;
      if (z2 <= ZNEAR) continue;
      var d = 1 - z1 / (SPAN + ZNEAR);
      if (d < 0.02) continue;
      var s1 = FL / z1, s2 = FL / z2;
      var w1 = Math.max(M * 2.6 * s1, W), w2 = Math.max(M * 2.6 * s2, W);
      bendAt(z1); var x1 = cx + bx, y1 = cy + by;
      bendAt(z2); var x2 = cx + bx, y2 = cy + by;
      var bd = band(nn);
      var sh = alpha * Math.pow(d, 1.15) * (0.11 + bd * 0.52) * (nn % 2 ? 0.48 : 1);
      ctx.fillStyle = rgba(mix(mix(STEEL, k, 0.52), HOT, bd * 0.24), sh);
      for (var sg = -1; sg <= 1; sg += 2){
        ctx.beginPath();
        ctx.moveTo(x1 - w1, y1 + sg * lift * s1);
        ctx.lineTo(x1 + w1, y1 + sg * lift * s1);
        ctx.lineTo(x2 + w2, y2 + sg * lift * s2);
        ctx.lineTo(x2 - w2, y2 + sg * lift * s2);
        ctx.closePath();
        ctx.fill();
      }
      ctx.globalAlpha = Math.min(1, alpha * Math.pow(d, 1.05) * (0.35 + bd));
      ctx.strokeStyle = rgba(mix(k, HOT, bd * 0.5), 1);
      ctx.lineWidth = 0.8 + d * 4.5;
      for (sg = -1; sg <= 1; sg += 2){
        ctx.beginPath();
        ctx.moveTo(x1 - w1, y1 + sg * lift * s1);
        ctx.lineTo(x1 + w1, y1 + sg * lift * s1);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  }

  /* ---- a solid icosahedron, back faces thrown away ---- */
  var VERTS = null, FACES = null, rx = 0, ry = 0;
  function solid(){
    if (VERTS) return;
    var p = 1.6180339887, v = [], i, j, a, b, c, sg = [1, -1];
    for (i = 0; i < 2; i++) for (j = 0; j < 2; j++){
      v.push([0, sg[i], sg[j] * p]);
      v.push([sg[i], sg[j] * p, 0]);
      v.push([sg[i] * p, 0, sg[j]]);
    }
    VERTS = v;
    var edge = function(x, y){
      var dx = v[x][0]-v[y][0], dy = v[x][1]-v[y][1], dz = v[x][2]-v[y][2];
      return Math.abs(dx*dx + dy*dy + dz*dz - 4) < 0.001;
    };
    FACES = [];
    for (a = 0; a < 12; a++) for (b = a+1; b < 12; b++) for (c = b+1; c < 12; c++)
      if (edge(a,b) && edge(b,c) && edge(a,c)) FACES.push([a,b,c]);
  }

  var PT = [];
  function core(k, alpha, blow){
    solid();
    var sa = Math.sin(rx), ca = Math.cos(rx), sb = Math.sin(ry), cb = Math.cos(ry);
    var R = M * (0.19 + blow * 0.17), zc = FL * 1.55, i;
    for (i = 0; i < 12; i++){
      var x = VERTS[i][0], y = VERTS[i][1], z = VERTS[i][2];
      var y2 = y * ca - z * sa, z2 = y * sa + z * ca;
      var x2 = x * cb + z2 * sb, z3 = -x * sb + z2 * cb;
      var s = FL / Math.max(70, zc + z3 * R);
      PT[i] = PT[i] || [0, 0, 0];
      PT[i][0] = cx + x2 * R * s; PT[i][1] = cy + y2 * R * s; PT[i][2] = z3;
    }
    for (i = 0; i < FACES.length; i++){
      var f = FACES[i], A = PT[f[0]], B = PT[f[1]], C = PT[f[2]];
      /* For a solid centred on the origin the outward normal of a face is
         its own centroid, so a face points at the camera exactly when its
         centroid sits in front of the centre. No winding order needed. */
      var cz = (A[2] + B[2] + C[2]) / 3;
      if (cz >= 0) continue;
      var facing = clamp(-cz / 1.51, 0, 1);
      ctx.fillStyle = rgba(mix(mix(STEEL, k, 0.72), HOT, facing * 0.45),
                           alpha * (0.14 + facing * 0.72));
      ctx.beginPath();
      ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.lineTo(C[0], C[1]);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = alpha * (0.2 + facing * 0.5);
      ctx.strokeStyle = rgba(mix(k, HOT, 0.45), 1);
      ctx.lineWidth = 1.4;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  /* ---- the vanishing point. something has to be down there. ---- */
  function eye(k, power, bass){
    var r = M * (0.05 + bass * 0.10 + power * 0.16);
    bendAt(ZNEAR + SPAN * 0.96);
    var ex = cx + bx * 0.5, ey = cy + by * 0.5;
    ctx.globalCompositeOperation = 'lighter';
    var g = ctx.createRadialGradient(ex, ey, 0, ex, ey, r * 3.4);
    g.addColorStop(0,    rgba(mix(k, HOT, 0.75), 0.62));
    g.addColorStop(0.22, rgba(k, 0.30));
    g.addColorStop(1,    rgba(k, 0));
    ctx.fillStyle = g;
    ctx.fillRect(ex - r * 3.4, ey - r * 3.4, r * 6.8, r * 6.8);
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---- sparks: debris coming off it, with depth so they streak ---- */
  var SP = [];
  function sparks(n){
    for (var i = 0; i < n && SP.length < 240; i++){
      SP.push({ a: Math.random() * TAU, r: M * (0.22 + Math.random() * 0.24),
                z: SPAN * (0.30 + Math.random() * 0.65),
                v: 1 + Math.random() * 2.4, spr: 0.3 + Math.random() * 1.7,
                life: 1, decay: 0.5 + Math.random() * 0.85 });
    }
  }
  function drawSparks(dt, k, speed){
    if (!SP.length) return;
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = rgba(mix(k, HOT, 0.6), 1);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (var i = SP.length - 1; i >= 0; i--){
      var p = SP[i];
      p.z -= speed * p.v * dt;
      p.r += M * 0.05 * p.spr * dt;
      p.life -= p.decay * dt;
      if (p.z < 45 || p.life <= 0){ SP.splice(i, 1); continue; }
      var s1 = FL / p.z, s2 = FL / (p.z + speed * p.v * 0.05);
      var c = Math.cos(p.a), sn = Math.sin(p.a);
      bendAt(p.z);
      ctx.moveTo(cx + bx + c * p.r * s1, cy + by + sn * p.r * s1);
      ctx.lineTo(cx + bx + c * p.r * s2, cy + by + sn * p.r * s2);
    }
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---- stars for the empty stretches ---- */
  var STARS = 200, stx = null, sty = null, stz = null;
  function stars(k, alpha, streak){
    if (!stx){
      stx = new Float32Array(STARS); sty = new Float32Array(STARS);
      stz = new Float32Array(STARS);
      for (var i = 0; i < STARS; i++){
        stx[i] = (Math.random() - 0.5) * M * 4;
        sty[i] = (Math.random() - 0.5) * M * 4;
        stz[i] = 60 + Math.random() * SPAN;
      }
    }
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = rgba(k, 1);
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    for (var j = 0; j < STARS; j++){
      var z = stz[j];
      if (z < 60){ stz[j] = SPAN; z = SPAN; }
      var s = FL / z, s2 = FL / (z + streak);
      ctx.moveTo(cx + stx[j] * s,  cy + sty[j] * s);
      ctx.lineTo(cx + stx[j] * s2, cy + sty[j] * s2);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  function starMarch(d){ if (stz) for (var i = 0; i < STARS; i++) stz[i] -= d; }

  /* ---- the rev counter. the track is named after it, so it is not small. ---- */
  function gauge(bass){
    var r = M * 0.142, gx = W - r - 38, gy = H - r - 74;
    if (W < 820){ r = M * 0.112; gx = W - r - 18; gy = H - r - 84; }
    var a0 = Math.PI * 0.74, a1 = Math.PI * 2.26;
    var v = clamp(rev, 0, 1.12), hot = v > 0.78;
    var kk = hot ? mix(AMBER, RED, clamp((v - 0.78) / 0.3, 0, 1)) : key();

    ctx.globalAlpha = 0.34;
    ctx.strokeStyle = rgba(STEEL, 1);
    ctx.lineWidth = 13;
    ctx.beginPath(); ctx.arc(gx, gy, r, a0, a1); ctx.stroke();

    ctx.globalAlpha = hot ? 0.92 : 0.38;
    ctx.strokeStyle = rgba(RED, 1);
    ctx.beginPath(); ctx.arc(gx, gy, r, a0 + (a1 - a0) * 0.78, a1); ctx.stroke();

    ctx.globalAlpha = 1;
    ctx.strokeStyle = rgba(kk, 1);
    ctx.beginPath(); ctx.arc(gx, gy, r, a0, a0 + (a1 - a0) * Math.min(1, v));
    ctx.stroke();

    if (hot){
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = clamp((v - 0.78) / 0.3, 0, 1) * (0.14 + bass * 0.26);
      var fg = ctx.createRadialGradient(gx, gy, r * 0.55, gx, gy, r * 1.35);
      fg.addColorStop(0, rgba(RED, 0.5));
      fg.addColorStop(1, rgba(RED, 0));
      ctx.fillStyle = fg;
      ctx.fillRect(gx - r * 1.4, gy - r * 1.4, r * 2.8, r * 2.8);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }

    var na = a0 + (a1 - a0) * Math.min(1, v);
    ctx.strokeStyle = rgba(HOT, 1);
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(gx - Math.cos(na) * r * 0.2, gy - Math.sin(na) * r * 0.2);
    ctx.lineTo(gx + Math.cos(na) * r * 0.84, gy + Math.sin(na) * r * 0.84);
    ctx.stroke();
    ctx.fillStyle = rgba(HOT, 1);
    ctx.beginPath(); ctx.arc(gx, gy, 5, 0, TAU); ctx.fill();

    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 2;
    for (var i = 0; i <= 8; i++){
      var ta = a0 + (a1 - a0) * (i / 8);
      ctx.strokeStyle = rgba(i >= 6 ? RED : STEEL, 1);
      ctx.beginPath();
      ctx.moveTo(gx + Math.cos(ta) * r * 1.16, gy + Math.sin(ta) * r * 1.16);
      ctx.lineTo(gx + Math.cos(ta) * r * (i >= 6 ? 1.34 : 1.27),
                 gy + Math.sin(ta) * r * (i >= 6 ? 1.34 : 1.27));
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function tear(power){
    var n = 2 + (power * 3) | 0;
    for (var i = 0; i < n; i++){
      var y = Math.random() * H, h = 4 + Math.random() * 58;
      var d = (Math.random() - 0.5) * 200 * power;
      ctx.drawImage(canvas, 0, y * dpr, canvas.width, h * dpr, d, y, W, h);
    }
  }

  var over = null, overKey = '', linePat = null;
  function overlay(){
    var q = Math.round(heat * 6);
    var k2 = W + 'x' + H + '|' + q + '|' + Math.round(dpr * 100);
    if (overKey !== k2){
      overKey = k2;
      if (!over) over = document.createElement('canvas');
      over.width = canvas.width; over.height = canvas.height;
      var g = over.getContext('2d');
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, W, H);
      var vg = g.createRadialGradient(cx, cy, M * 0.30, cx, cy, M * 1.0);
      vg.addColorStop(0, 'rgba(0,0,0,0)');
      vg.addColorStop(1, 'rgba(0,0,0,' + (0.44 + (q / 6) * 0.30).toFixed(3) + ')');
      g.fillStyle = vg; g.fillRect(0, 0, W, H);
      if (!reduce){
        if (!linePat){
          var c = document.createElement('canvas');
          c.width = 1; c.height = 3;
          var gc = c.getContext('2d');
          gc.fillStyle = 'rgba(0,0,0,0.34)';
          gc.fillRect(0, 0, 1, 1);
          linePat = c;
        }
        g.globalAlpha = 0.5;
        g.fillStyle = g.createPattern(linePat, 'repeat');
        g.fillRect(0, 0, W, H);
        g.globalAlpha = 1;
      }
    }
    ctx.drawImage(over, 0, 0, W, H);
  }

  /* ================= the loop ================= */
  var last = 0, now8 = 0, roll = 0, cut = 0;

  function frame(ms){
    requestAnimationFrame(frame);
    now8 = ms / 1000;
    var dt = last ? Math.min(now8 - last, 0.05) : 0.016;
    last = now8;
    ema = ema * 0.94 + dt * 0.06;
    slow = ema > 0.034 ? Math.min(1, slow + dt * 0.5) : Math.max(0, slow - dt * 0.25);

    var t = audio.currentTime;
    state(t, dt);
    readBands();
    beats(t);

    var bass = energy(1, 14);
    var since = t - beatAt;
    var pulse = since >= 0 && since < SPB * 0.9
      ? Math.pow(1 - since / (SPB * 0.9), 2.2) * beatHard : 0;
    var k = key();

    var sc = t - sceneAt;
    cut = sc >= 0 && sc < 0.26 ? Math.pow(1 - sc / 0.26, 2) : 0;

    /* Solid walls do not want a heavy smear behind them, they want to be
       seen. So this is a clear with a little carry, not a wake. */
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = rgba(INK, 0.52 + (1 - heat) * 0.34);
    ctx.fillRect(0, 0, W, H);

    var speed = (scene === 'sub' ? 340 : scene === 'void' ? 460 : scene === 'dead' ? 80
               : 1200 + heat * 3200) * (1 + bass * 0.75);
    travel += dt * speed;
    starMarch(dt * speed * 1.15);
    spin += dt * (0.05 + heat * 0.24 + (scene === 'kaleido' ? 0.40 : 0));
    bendT += dt * (0.16 + heat * 0.34);
    rx += dt * (0.33 + heat * 0.45); ry += dt * (0.22 + bass * 0.8);
    roll += dt * (heat > 0.85 ? 0.22 : 0.05) * Math.sin(now8 * 0.31);

    shake *= Math.pow(0.0018, dt);
    var amp = M * 0.026 * shake;

    ctx.save();
    ctx.translate(cx + (Math.random() - 0.5) * amp, cy + (Math.random() - 0.5) * amp);
    var rollK = scene === 'corridor' ? 0.14 : 1;
    ctx.rotate(roll * rollK + (Math.random() - 0.5) * 0.014 * shake);
    var punch = 1 + pulse * (0.008 + heat * 0.032);
    ctx.scale(punch, punch);
    ctx.translate(-cx, -cy);

    /* ---- the scene ---- */
    if (scene === 'void' || scene === 'dead'){
      stars(mix(STEEL, k, 0.7), 0.55, speed * 0.06);
      if (scene !== 'dead'){
        shaft(12, t, k, 0.36, false);
        eye(k, pulse * 0.2, bass * 0.5);
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.5;
        ctx.strokeStyle = rgba(k, 1);
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        for (var q2 = 0; q2 <= N; q2++){
          ctx.lineTo((q2 / N) * W, cy + M * 0.34 - level[q2 % N] * M * 0.17);
        }
        ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
      }

    } else if (scene === 'corridor'){
      /* a road bends sideways. it does not bend upwards, or the far floor
         ends up above the near ceiling and the room turns inside out. */
      bendH = 0.55; bendV = 0;
      corridor(t, k, 0.9, bass);
      stars(k, 0.24, speed * 0.05);
      eye(k, pulse * 0.35, bass);
      bendH = 1; bendV = 1;

    } else if (scene === 'sub'){
      /* no top end in the music, so no detail on the screen. huge and slow. */
      shaft(6, t, k, 1.0, true);
      rails(6, t, k, 0.5);
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.22 + bass * 0.42;
      var g2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, M * (0.34 + bass * 0.5));
      g2.addColorStop(0, rgba(RED, 0.5));
      g2.addColorStop(1, rgba(RED, 0));
      ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';

    } else if (scene === 'core'){
      stars(mix(STEEL, k, 0.7), 0.34, speed * 0.05);
      shaft(12, t, k, 0.34, false);
      eye(k, pulse * 0.3, bass * 0.7);
      core(k, 0.95, pulse * 0.45 + bass * 0.22);

    } else if (scene === 'kaleido'){
      var folds = slow > 0.5 ? 3 : 5;
      for (var fo = 0; fo < folds; fo++){
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate((fo / folds) * TAU);
        if (fo % 2) ctx.scale(1, -1);
        ctx.translate(-cx, -cy);
        shaft(7, t, fo % 2 ? mix(k, HOT, 0.3) : k,
              fo === 0 ? 0.82 : fo === 1 ? 0.30 : 0.22, fo < 2);
        ctx.restore();
      }
      eye(mix(k, HOT, 0.35), pulse * 0.5, bass * 0.9);
      core(mix(k, HOT, 0.4), 0.58, pulse * 0.5);
      if (!reduce){
        var kab = 2 + pulse * 7;
        var kch = [[[255, 40, 140], -kab], [[90, 160, 255], kab]];
        ctx.globalCompositeOperation = 'lighter';
        for (var kc = 0; kc < 2; kc++){
          ctx.save();
          ctx.translate(kch[kc][1], 0);
          shaft(7, t, kch[kc][0], 0.24, false);
          ctx.restore();
        }
        ctx.globalCompositeOperation = 'source-over';
      }

    } else { /* shaft and redline */
      var red = scene === 'redline';
      shaft(red ? 14 : 16, t, k, red ? 1.0 : 0.9, true);
      rails(red ? 14 : 16, t, k, red ? 0.55 : 0.34);
      eye(k, pulse * (red ? 0.6 : 0.3), bass);
      if (red && !reduce){
        /* Three offset rib passes, one per channel, so the edges fringe the
           way a lens does when it is being asked for more than it has. */
        var ab = 1.5 + pulse * 6 + heat * 2.5;
        var ch = [[[255, 24, 24], -ab], [[60, 255, 110], 0], [[70, 110, 255], ab]];
        ctx.globalCompositeOperation = 'lighter';
        for (var ci = 0; ci < 3; ci++){
          ctx.save();
          ctx.translate(ch[ci][1], 0);
          shaft(14, t, ch[ci][0], 0.26, false);
          ctx.restore();
        }
        ctx.globalCompositeOperation = 'source-over';
      }
    }

    if (scene !== 'dead') drawSparks(dt, k, speed);

    /* the pressure front, drawn as a ring you can watch leave */
    var bdd = t - blastAt;
    if (bdd >= 0 && bdd < 1.1){
      var bp = bdd / 1.1;
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = (1 - bp) * (1 - bp) * 0.30;
      ctx.strokeStyle = rgba(mix(k, HOT, 0.5), 1);
      ctx.lineWidth = 2 + (1 - bp) * 9;
      ctx.beginPath();
      ctx.arc(cx, cy, M * (0.10 + bp * 1.0), 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    ctx.restore();

    if (!reduce){
      var td = t - tearAt;
      if (td >= 0 && td < 0.14) tear(0.5 + heat * 0.6);
      var cd = t - chromaAt;
      if (cd >= 0 && cd < 0.07){
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.2;
        ctx.drawImage(canvas, 8, 0, W, H);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
      }
    }

    if (cut > 0.01){
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = cut * 0.09;
      ctx.fillStyle = rgba(HOT, 1);
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    if (slow < 0.6) overlay();
    gauge(bass);
    hud(t);
  }

  /* ================= hud ================= */
  var lastShown = -1;
  function hud(t){
    var p = clamp(t / T.dur, 0, 1);
    fill.style.width = (p * 100) + '%';
    head.style.left = (p * 100) + '%';
    var s = t | 0;
    if (s !== lastShown){
      lastShown = s;
      clock.textContent = (s / 60 | 0) + ':' + ('0' + (s % 60)).slice(-2);
      bar.setAttribute('aria-valuenow', String(s));
    }
  }

  function jumped(){
    lastBeat = -1e9; beatAt = -9; beatHard = 0;
    tearAt = chromaAt = blastAt = sceneAt = -9;
    travel = 0; stz = null; stx = null; sty = null; SP.length = 0; shake = 0;
  }

  bar.addEventListener('click', function(e){
    var r = bar.getBoundingClientRect();
    audio.currentTime = clamp(((e.clientX - r.left) / r.width) * T.dur, 0, T.dur - 0.05);
    jumped();
  });
  bar.addEventListener('keydown', function(e){
    var d = e.key === 'ArrowRight' ? 5 : e.key === 'ArrowLeft' ? -5 : 0;
    if (!d) return;
    e.preventDefault();
    audio.currentTime = clamp(audio.currentTime + d, 0, T.dur - 0.05);
    jumped();
  });

  function toggle(){
    if (audio.paused){
      if (actx && actx.state === 'suspended') actx.resume();
      audio.play();
    } else audio.pause();
  }
  pp.addEventListener('click', toggle);
  audio.addEventListener('play',  function(){ document.body.classList.add('going'); });
  audio.addEventListener('pause', function(){ document.body.classList.remove('going'); });
  document.addEventListener('keydown', function(e){
    if (e.code === 'Space' && e.target === document.body){ e.preventDefault(); toggle(); }
  });

  var idleTimer;
  function stir(){
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){ document.body.classList.add('idle'); }, 2800);
  }
  document.addEventListener('mousemove', stir);
  document.addEventListener('touchstart', stir);

  document.getElementById('start').addEventListener('click', function(){
    listen();
    if (actx && actx.state === 'suspended') actx.resume();
    audio.play();
    gate.classList.add('gone');
    setTimeout(function(){ gate.style.display = 'none'; }, 900);
    stir();
  });

  window.__od = {
    T: T, grid: GRID, arc: ARC,
    at: function(t){
      state(t);
      return { scene: scene, heat: +heat.toFixed(3), rev: +rev.toFixed(3),
               shake: +shake.toFixed(3), sparks: SP.length };
    }
  };

  size();
  requestAnimationFrame(frame);

  try { if (window.top !== window.self) document.querySelector('.backlink').remove(); }
  catch(e){}
})();
</script>
</body>
